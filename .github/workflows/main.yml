name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 */6 * * *' # ၆ နာရီတစ်ကြိမ် Auto Run မည်
  workflow_dispatch: # လက်ဖြင့် ကိုယ်တိုင် Run ခလုတ် နှိပ်နိုင်သည်

jobs:
  update-sub:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper & Repair Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node update.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "Auto update sub [skip ci]" || exit 0
          git pull --rebase origin main
          git push
