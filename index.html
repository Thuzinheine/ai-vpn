<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['SF Mono', 'JetBrains Mono', 'Menlo', 'monospace'],
          },
          colors: {
            mac: {
              base: '#000000',
              panel: '#121214',
              sub: '#1c1c1e',
              border: 'rgba(255, 255, 255, 0.08)',
              hover: 'rgba(255, 255, 255, 0.04)',
              blue: '#0a84ff',
              blueHover: '#0071e3',
              green: '#30d158',
              amber: '#ff9f0a',
              text: '#ffffff',
              muted: '#86868b',
              dim: '#545458'
            }
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      height: 100vh;
      overflow: hidden; /* Screen မရွေ့အောင် Main Page Scroll အပြည့်ဖျောက်ထားပါသည် */
      background-color: #000000;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .panel-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .panel-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .panel-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="flex flex-col p-3 sm:p-4 selection:bg-mac-blue/30 selection:text-white">

  <!-- Top Single Bar Header -->
  <header class="h-11 bg-mac-panel border border-mac-border rounded-xl px-4 flex items-center justify-between flex-shrink-0 mb-3">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></span>
      </div>
      <span class="text-xs font-semibold tracking-tight text-white pl-2 border-l border-mac-border">AI-VPN Core</span>
      <span class="text-[10px] text-mac-muted font-mono">Edge Dashboard</span>
    </div>

    <!-- Metrics Status -->
    <div class="flex items-center gap-2 text-xs font-mono">
      <div class="bg-mac-sub px-2.5 py-1 rounded-lg border border-mac-border flex items-center gap-1.5">
        <span class="text-mac-muted text-[10px] font-sans">Active</span>
        <span id="selectedCount" class="font-bold text-mac-blue">0</span>
        <span class="text-mac-dim">/</span>
        <span id="nodeCount" class="text-mac-muted">0</span>
      </div>
      <div class="bg-mac-sub px-2.5 py-1 rounded-lg border border-mac-border flex items-center gap-1.5">
        <span class="text-mac-muted text-[10px] font-sans">Latency</span>
        <span id="bestPing" class="font-bold text-mac-green">-- ms</span>
      </div>
    </div>
  </header>

  <!-- 100% Height Non-Scrollable Split Workspace -->
  <main class="grid grid-cols-1 lg:grid-cols-12 gap-3 flex-1 min-h-0">
    
    <!-- Left Column: Controls (Col Span 4) -->
    <section class="lg:col-span-4 bg-mac-panel border border-mac-border rounded-xl p-4 flex flex-col justify-between overflow-hidden">
      
      <div class="space-y-3">
        <!-- 1. All Nodes sub.txt -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-mac-muted font-medium flex items-center gap-1.5">
              <i class="fa-solid fa-layer-group text-[10px]"></i> Main Sub (50 Pool)
            </span>
            <span class="text-mac-dim font-mono text-[10px]">sub.txt</span>
          </div>
          <div class="flex items-center gap-1.5 bg-mac-sub border border-mac-border rounded-lg p-1">
            <input type="text" id="officialSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
              class="w-full bg-transparent border-0 px-2 text-[11px] text-mac-muted font-mono truncate select-all focus:outline-none">
            <button onclick="copyLink('officialSubUrl', 'copyOfficialBtn')" class="bg-white/10 hover:bg-white/20 text-white px-2.5 py-1 rounded text-[10px] font-medium transition active:scale-95 flex items-center gap-1 flex-shrink-0">
              <i class="fa-regular fa-copy"></i>
              <span id="copyOfficialBtn">Copy</span>
            </button>
          </div>
        </div>

        <!-- 2. Fast Nodes fast-sub.txt -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-mac-blue font-medium flex items-center gap-1.5">
              <i class="fa-solid fa-bolt text-[10px]"></i> Fast Sub (Selected Pool)
            </span>
            <span class="text-mac-blue/60 font-mono text-[10px]">fast-sub.txt</span>
          </div>
          <div class="flex items-center gap-1.5 bg-mac-sub border border-mac-border rounded-lg p-1">
            <input type="text" id="fastSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/fast-sub.txt"
              class="w-full bg-transparent border-0 px-2 text-[11px] text-mac-blue font-mono truncate select-all focus:outline-none">
            <button onclick="copyLink('fastSubUrl', 'copyFastBtn')" class="bg-mac-blue/20 hover:bg-mac-blue/30 text-mac-blue px-2.5 py-1 rounded text-[10px] font-medium transition active:scale-95 flex items-center gap-1 flex-shrink-0">
              <i class="fa-regular fa-copy"></i>
              <span id="copyFastBtn">Copy</span>
            </button>
          </div>
        </div>

        <!-- PAT Key Input -->
        <div class="space-y-1 pt-1">
          <label class="text-[11px] text-mac-muted font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-key text-[10px]"></i> GitHub PAT Token
          </label>
          <div class="relative">
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
              class="w-full bg-mac-sub border border-mac-border rounded-lg pl-2.5 pr-8 py-1.5 text-xs text-white placeholder-mac-dim focus:outline-none focus:border-mac-blue font-mono">
            <button type="button" onclick="toggleTokenVisibility()" class="absolute right-2.5 top-2 text-mac-dim hover:text-white">
              <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Buttons Grid -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="triggerGithubUpdate()" id="updateBtn"
            class="bg-mac-sub hover:bg-white/10 border border-mac-border text-white font-medium py-2 rounded-lg text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
            <i id="btnIcon" class="fa-solid fa-rotate text-[11px]"></i>
            <span>Action Scrape</span>
          </button>

          <button onclick="runBenchmarkAll()" id="benchmarkBtn"
            class="bg-mac-blue hover:bg-mac-blueHover text-white font-medium py-2 rounded-lg text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
            <i id="testIcon" class="fa-solid fa-gauge text-[11px]"></i>
            <span>Benchmark</span>
          </button>
        </div>

        <!-- Save to fast-sub.txt -->
        <button onclick="saveFastSubToGithub()" id="saveFastBtn"
          class="w-full bg-mac-sub hover:bg-white/10 border border-mac-border text-white font-medium py-2 rounded-lg text-xs flex items-center justify-center gap-2 active:scale-95 transition">
          <i id="saveFastIcon" class="fa-solid fa-cloud-arrow-up text-mac-blue text-[11px]"></i>
          <span id="saveFastText">Save to fast-sub.txt</span>
        </button>

        <!-- Dynamic Status Bar -->
        <div id="statusBox" class="hidden p-2 rounded-lg text-[11px] flex items-center gap-2 border">
          <i id="statusIcon" class="fa-solid fa-info text-[10px]"></i>
          <span id="statusMessage" class="truncate font-medium"></span>
        </div>
      </div>

      <!-- External Key Input -->
      <div class="pt-2 border-t border-mac-border space-y-1.5">
        <span class="text-[10px] text-mac-muted font-medium">Add External VLESS Key</span>
        <div class="flex gap-1.5">
          <input type="text" id="customNodeInput" placeholder="vless://..."
            class="w-full bg-mac-sub border border-mac-border rounded-lg px-2 py-1.5 text-xs text-white placeholder-mac-dim focus:outline-none focus:border-mac-blue font-mono">
          <button onclick="addCustomNode()" class="bg-mac-sub hover:bg-white/10 border border-mac-border text-white px-3 py-1.5 rounded-lg text-xs font-medium active:scale-95 transition">
            Add
          </button>
        </div>
      </div>

    </section>

    <!-- Right Column: Node Selection Pool (Col Span 8) -->
    <section class="lg:col-span-8 bg-mac-panel border border-mac-border rounded-xl p-3 flex flex-col overflow-hidden min-h-0">
      
      <!-- Toolbar -->
      <div class="flex items-center justify-between pb-2.5 border-b border-mac-border flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-white">Nodes Pool</span>
          <span class="text-[10px] text-mac-dim font-mono">(Click icon to copy)</span>
        </div>

        <!-- Apple Style Filter Pills -->
        <div class="flex items-center gap-1 bg-mac-sub p-1 rounded-lg border border-mac-border text-[10px]">
          <button onclick="selectPreset('all')" class="hover:bg-white/10 text-white px-2 py-0.5 rounded transition">All</button>
          <button onclick="selectPreset('good')" class="hover:bg-white/10 text-mac-blue px-2 py-0.5 rounded transition">&lt; 350ms</button>
          <button onclick="selectPreset('none')" class="hover:bg-white/10 text-mac-muted px-2 py-0.5 rounded transition">Clear</button>
          <button onclick="fetchAndParseNodes()" title="Reload list" class="text-mac-muted hover:text-white px-1.5 py-0.5 rounded transition">
            <i class="fa-solid fa-rotate-right text-[10px]"></i>
          </button>
        </div>
      </div>

      <!-- Internal Scrollable Node List (Main Page doesn't scroll) -->
      <div id="nodeListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-2 overflow-y-auto panel-scroll flex-1 content-start pr-1">
        <div class="col-span-full text-center py-24 text-xs text-mac-dim">
          <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Loading active nodes...
        </div>
      </div>

    </section>

  </main>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-2 rounded-lg text-[11px] flex items-center gap-2 border ";
      if (type === "success") {
        box.classList.add("bg-mac-sub", "border-mac-green/30", "text-mac-green");
        icon.className = "fa-solid fa-check text-[10px] text-mac-green";
      } else if (type === "error") {
        box.classList.add("bg-mac-sub", "border-rose-500/30", "text-rose-400");
        icon.className = "fa-solid fa-circle-exclamation text-[10px] text-rose-400";
      } else {
        box.classList.add("bg-mac-sub", "border-mac-border", "text-mac-muted");
        icon.className = "fa-solid fa-circle-notch fa-spin text-[10px] text-mac-blue";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="col-span-full text-center py-24 text-xs text-mac-dim"><i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Loading sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { id: idx, uri, name, host, ping: null, speed: null, selected: true };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="col-span-full text-center py-24 text-xs text-rose-400">Unable to load sub.txt</div>`;
      }
    }

    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="col-span-full text-center py-24 text-xs text-mac-dim">No nodes available.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-mac-sub border ${n.selected ? 'border-mac-blue/40' : 'border-mac-border'} hover:border-white/20 px-2.5 py-1.5 rounded-lg flex items-center justify-between gap-2 transition h-[48px]">
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <input type="checkbox" ${n.selected ? 'checked' : ''} onchange="toggleSelect(${i})"
              class="w-3.5 h-3.5 rounded bg-mac-panel border-mac-border text-mac-blue focus:ring-0 cursor-pointer accent-mac-blue">
            
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${n.ping ? (n.ping < 250 ? 'bg-mac-green' : 'bg-mac-amber') : 'bg-mac-dim'}"></span>
                <h3 class="text-xs font-medium ${n.selected ? 'text-white' : 'text-mac-muted'} truncate">${n.name}</h3>
              </div>
              <p class="text-[10px] text-mac-dim font-mono mt-0.5 truncate pl-3">${n.host}</p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <div class="text-right font-mono">
              <div class="text-[11px] font-medium ${n.ping ? (n.ping < 250 ? 'text-mac-green' : 'text-mac-amber') : 'text-mac-dim'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[9px] text-mac-dim">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode(${i})" title="Copy key" class="bg-white/5 hover:bg-white/15 text-mac-muted hover:text-white p-1 rounded text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy text-[11px]"></i>
            </button>
          </div>
        </div>
      `).join('');

      updateSelectionCount();
    }

    function toggleSelect(index) {
      parsedNodes[index].selected = !parsedNodes[index].selected;
      renderNodes();
    }

    function selectPreset(type) {
      if (type === 'all') {
        parsedNodes.forEach(n => n.selected = true);
      } else if (type === 'none') {
        parsedNodes.forEach(n => n.selected = false);
      } else if (type === 'good') {
        parsedNodes.forEach(n => {
          n.selected = (n.ping !== null && n.ping < 350);
        });
      }
      renderNodes();
    }

    function updateSelectionCount() {
      const selected = parsedNodes.filter(n => n.selected).length;
      document.getElementById("selectedCount").innerText = selected;
    }

    function addCustomNode() {
      const input = document.getElementById("customNodeInput");
      const val = input.value.trim();

      if (!val || !val.startsWith("vless://")) {
        showStatus("Invalid vless:// key", "error");
        return;
      }

      let name = `Custom-${parsedNodes.length + 1}`;
      let host = "custom.edge";
      try {
        if (val.includes('#')) name = decodeURIComponent(val.split('#')[1]);
        const matchHost = val.match(/sni=([^&]+)/) || val.match(/host=([^&]+)/) || val.match(/@([^:]+)/);
        if (matchHost) host = matchHost[1];
      } catch(e) {}

      parsedNodes.unshift({
        id: Date.now(),
        uri: val,
        name: name,
        host: host,
        ping: null,
        speed: null,
        selected: true
      });

      input.value = "";
      document.getElementById("nodeCount").innerText = parsedNodes.length;
      renderNodes();
      showStatus(`Added "${name}"`, "success");
    }

    async function testSingleNode(node) {
      const start = performance.now();
      try {
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        const duration = Math.round(performance.now() - start);
        if (duration < 2000) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Benchmarking latency...", "loading");

      let best = 9999;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        parsedNodes[i].selected = (parsedNodes[i].ping !== null && parsedNodes[i].ping < 450);
        renderNodes();
      }

      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-gauge text-[11px]";
      showStatus("Benchmark Complete", "success");
    }

    async function saveFastSubToGithub() {
      const token = document.getElementById("tokenInput").value.trim();
      const selectedUris = parsedNodes.filter(n => n.selected).map(n => n.uri);

      if (!token) {
        showStatus("GitHub PAT required", "error");
        return;
      }

      if (selectedUris.length === 0) {
        showStatus("Select at least 1 node", "error");
        return;
      }

      const saveBtn = document.getElementById("saveFastBtn");
      const saveIcon = document.getElementById("saveFastIcon");
      const saveText = document.getElementById("saveFastText");

      saveBtn.disabled = true;
      saveIcon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      saveText.innerText = "Saving...";
      showStatus("Saving to fast-sub.txt...", "loading");

      try {
        const base64Content = btoa(selectedUris.join('\n'));
        let sha = null;
        try {
          const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`
            }
          });
          if (fileRes.ok) {
            const fileData = await fileRes.json();
            sha = fileData.sha;
          }
        } catch (e) {}

        const putPayload = {
          message: `Update fast-sub.txt (${selectedUris.length} nodes)`,
          content: base64Content,
          branch: "main"
        };
        if (sha) putPayload.sha = sha;

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putPayload)
        });

        if (updateRes.ok) {
          showStatus(`Saved ${selectedUris.length} nodes to fast-sub.txt`, "success");
          document.getElementById("fastSubUrl").value = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/fast-sub.txt?t=${Date.now()}`;
        } else {
          const err = await updateRes.json();
          showStatus(`Error: ${err.message}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error", "error");
      } finally {
        saveBtn.disabled = false;
        saveIcon.className = "fa-solid fa-cloud-arrow-up text-[11px] text-mac-blue";
        saveText.innerText = "Save to fast-sub.txt";
      }
    }

    function copyLink(inputId, btnId) {
      const input = document.getElementById(inputId);
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById(btnId);
      btn.innerText = "Copied";
      setTimeout(() => btn.innerText = "Copy", 2000);
      showStatus("Link copied", "success");
    }

    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`Copied "${node.name}"`, "success");
    }

    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("PAT Token required", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Dispatching Action...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Action dispatched! Refreshing in 15s...", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger failed", "error");
        }
      } catch (err) {
        showStatus("Network Error", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-rotate text-[11px]";
      }
    }

    fetchAndParseNodes();
  </script>
</body>
