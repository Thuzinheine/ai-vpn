<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-VPN Engine | Edge Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '-apple-system', 'sans-serif'],
            mono: ['Geist Mono', 'monospace'],
          },
          colors: {
            app: {
              bg: '#050506',
              surface: '#0b0c0e',
              card: '#111215',
              cardHover: '#16181c',
              border: 'rgba(255, 255, 255, 0.07)',
              borderFocus: 'rgba(255, 255, 255, 0.18)',
              brand: '#3b82f6',
              brandGlow: 'rgba(59, 130, 246, 0.15)',
              emerald: '#10b981',
              amber: '#f59e0b',
              text: '#ededed',
              muted: '#787b86',
              faint: '#40434c'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050506;
      background-image: 
        radial-gradient(ellipse 60% 50% at 50% -20%, rgba(59, 130, 246, 0.12), transparent),
        radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.03), transparent 30%);
      color: #ededed;
      -webkit-font-smoothing: antialiased;
    }
    .grid-lines {
      background-size: 24px 24px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-8 flex items-center justify-center grid-lines selection:bg-blue-600/30 selection:text-white">

  <!-- Main Container -->
  <div class="w-full max-w-6xl space-y-4">

    <!-- Top Status Bar -->
    <header class="bg-app-surface border border-app-border rounded-2xl px-5 py-3.5 flex flex-wrap items-center justify-between gap-4 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
          <i class="fa-solid fa-bolt-lightning text-xs"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold text-white tracking-wide">AI-VPN EDGE</span>
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[10px] font-mono text-app-muted">v3.0.0</span>
          </div>
          <p class="text-[11px] text-app-muted">Next-Gen VLESS Auto-Scraper & Latency Pipeline</p>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs font-mono">
        <div class="bg-app-card border border-app-border px-3 py-1.5 rounded-xl flex items-center gap-2">
          <span class="text-app-muted text-[10px] font-sans">Active</span>
          <span id="selectedCount" class="font-semibold text-blue-400">0</span>
          <span class="text-app-faint">/</span>
          <span id="nodeCount" class="text-app-muted">0</span>
        </div>
        <div class="bg-app-card border border-app-border px-3 py-1.5 rounded-xl flex items-center gap-2">
          <span class="text-app-muted text-[10px] font-sans">Lowest Ping</span>
          <span id="bestPing" class="font-semibold text-emerald-400">-- ms</span>
        </div>
      </div>
    </header>

    <!-- Two-Column Workbench Layout -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-4">
      
      <!-- Control Panel (Left 5 Cols) -->
      <section class="lg:col-span-5 space-y-3.5">
        
        <!-- Primary Config Box -->
        <div class="bg-app-surface border border-app-border rounded-2xl p-4.5 space-y-3.5">
          
          <!-- Endpoints -->
          <div class="space-y-2.5">
            <!-- sub.txt -->
            <div class="space-y-1">
              <div class="flex justify-between items-center text-[11px]">
                <span class="text-app-text font-medium flex items-center gap-1.5">
                  <i class="fa-solid fa-server text-[10px] text-app-muted"></i> Main Pool (50 Nodes)
                </span>
                <span class="text-[10px] text-app-faint font-mono">sub.txt</span>
              </div>
              <div class="flex items-center gap-1.5 bg-app-card border border-app-border rounded-xl p-1.5 focus-within:border-app-borderFocus transition">
                <input type="text" id="officialSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
                  class="w-full bg-transparent border-0 px-2 text-[11px] text-app-muted font-mono truncate select-all focus:outline-none">
                <button onclick="copyLink('officialSubUrl', 'copyOfficialBtn')" class="bg-white/[0.04] hover:bg-white/[0.08] text-white px-2.5 py-1 rounded-lg text-[10px] font-mono transition active:scale-95 flex items-center gap-1 flex-shrink-0">
                  <i class="fa-regular fa-copy"></i>
                  <span id="copyOfficialBtn">Copy</span>
                </button>
              </div>
            </div>

            <!-- fast-sub.txt -->
            <div class="space-y-1">
              <div class="flex justify-between items-center text-[11px]">
                <span class="text-blue-400 font-medium flex items-center gap-1.5">
                  <i class="fa-solid fa-bolt text-[10px]"></i> Fast Pool (Custom Selected)
                </span>
                <span class="text-[10px] text-blue-500/50 font-mono">fast-sub.txt</span>
              </div>
              <div class="flex items-center gap-1.5 bg-app-card border border-app-border rounded-xl p-1.5 focus-within:border-blue-500/40 transition">
                <input type="text" id="fastSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/fast-sub.txt"
                  class="w-full bg-transparent border-0 px-2 text-[11px] text-blue-400 font-mono truncate select-all focus:outline-none">
                <button onclick="copyLink('fastSubUrl', 'copyFastBtn')" class="bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-lg text-[10px] font-mono transition active:scale-95 flex items-center gap-1 flex-shrink-0">
                  <i class="fa-regular fa-copy"></i>
                  <span id="copyFastBtn">Copy</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Token Input -->
          <div class="space-y-1.5 pt-1">
            <div class="flex justify-between text-[11px]">
              <label class="text-app-muted font-medium flex items-center gap-1.5">
                <i class="fa-solid fa-key text-[10px]"></i> GitHub PAT Token
              </label>
              <span class="text-app-faint text-[10px]">Local memory only</span>
            </div>
            <div class="relative">
              <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
                class="w-full bg-app-card border border-app-border rounded-xl pl-3 pr-8 py-2 text-xs text-white placeholder-app-faint focus:outline-none focus:border-app-borderFocus font-mono transition">
              <button type="button" onclick="toggleTokenVisibility()" class="absolute right-2.5 top-2.5 text-app-faint hover:text-white">
                <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Actions -->
          <div class="space-y-2 pt-1">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="triggerGithubUpdate()" id="updateBtn"
                class="bg-app-card hover:bg-app-cardHover border border-app-border text-app-text font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
                <i id="btnIcon" class="fa-solid fa-arrows-rotate text-[11px] text-app-muted"></i>
                <span>Scrape GitHub</span>
              </button>

              <button onclick="runBenchmarkAll()" id="benchmarkBtn"
                class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 active:scale-95 transition shadow-lg shadow-blue-600/20">
                <i id="testIcon" class="fa-solid fa-stopwatch text-[11px]"></i>
                <span>Test Latency</span>
              </button>
            </div>

            <button onclick="saveFastSubToGithub()" id="saveFastBtn"
              class="w-full bg-app-card hover:bg-app-cardHover border border-app-border hover:border-blue-500/40 text-app-text font-medium py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition">
              <i id="saveFastIcon" class="fa-solid fa-cloud-arrow-up text-blue-400 text-xs"></i>
              <span id="saveFastText">Save Selected to fast-sub.txt</span>
            </button>
          </div>

          <!-- Status Toast -->
          <div id="statusBox" class="hidden p-2.5 rounded-xl text-[11px] flex items-center gap-2 border">
            <i id="statusIcon" class="fa-solid fa-info text-[10px]"></i>
            <span id="statusMessage" class="truncate font-medium"></span>
          </div>
        </div>

        <!-- Add Custom Node Box -->
        <div class="bg-app-surface border border-app-border rounded-2xl p-3.5 space-y-2">
          <span class="text-[11px] text-app-muted font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-plus text-[10px]"></i> Add External VLESS Config
          </span>
          <div class="flex gap-2">
            <input type="text" id="customNodeInput" placeholder="vless://..."
              class="w-full bg-app-card border border-app-border rounded-xl px-3 py-1.5 text-xs text-white placeholder-app-faint focus:outline-none focus:border-app-borderFocus font-mono transition">
            <button onclick="addCustomNode()" class="bg-app-card hover:bg-app-cardHover border border-app-border text-white px-3.5 py-1.5 rounded-xl text-xs font-medium active:scale-95 transition">
              Add
            </button>
          </div>
        </div>

      </section>

      <!-- Node Pool Explorer (Right 7 Cols) -->
      <section class="lg:col-span-7 bg-app-surface border border-app-border rounded-2xl p-4.5 flex flex-col justify-between">
        
        <!-- Header Toolbar -->
        <div class="flex items-center justify-between pb-3 border-b border-app-border flex-shrink-0">
          <div>
            <h2 class="text-xs font-semibold text-white tracking-wide">Node Matrix</h2>
            <p class="text-[10px] text-app-muted">Check to include in fast-sub.txt payload</p>
          </div>

          <!-- Filter Pills -->
          <div class="flex items-center gap-1 bg-app-card p-1 rounded-xl border border-app-border text-[10px] font-mono">
            <button onclick="selectPreset('all')" class="hover:bg-white/[0.06] text-app-text px-2.5 py-1 rounded-lg transition">All</button>
            <button onclick="selectPreset('good')" class="hover:bg-white/[0.06] text-blue-400 px-2.5 py-1 rounded-lg transition">&lt; 350ms</button>
            <button onclick="selectPreset('none')" class="hover:bg-white/[0.06] text-app-muted px-2.5 py-1 rounded-lg transition">Clear</button>
            <button onclick="fetchAndParseNodes()" title="Reload" class="text-app-muted hover:text-white px-2 py-1 rounded-lg transition">
              <i class="fa-solid fa-rotate-right text-[10px]"></i>
            </button>
          </div>
        </div>

        <!-- Node Cards Grid -->
        <div id="nodeListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-3 overflow-y-auto custom-scroll max-h-[520px] content-start pr-1">
          <div class="col-span-full text-center py-28 text-xs text-app-faint">
            <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Initializing node pool...
          </div>
        </div>

      </section>

    </main>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-2.5 rounded-xl text-[11px] flex items-center gap-2 border transition-all ";
      if (type === "success") {
        box.classList.add("bg-emerald-950/20", "border-emerald-500/30", "text-emerald-400");
        icon.className = "fa-solid fa-check text-[10px] text-emerald-400";
      } else if (type === "error") {
        box.classList.add("bg-rose-950/20", "border-rose-500/30", "text-rose-400");
        icon.className = "fa-solid fa-triangle-exclamation text-[10px] text-rose-400";
      } else {
        box.classList.add("bg-app-card", "border-app-border", "text-app-muted");
        icon.className = "fa-solid fa-circle-notch fa-spin text-[10px] text-blue-400";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="col-span-full text-center py-28 text-xs text-app-faint"><i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Fetching nodes from sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { id: idx, uri, name, host, ping: null, speed: null, selected: true };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="col-span-full text-center py-28 text-xs text-rose-400">Failed to load sub.txt. Make sure file exists.</div>`;
      }
    }

    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="col-span-full text-center py-28 text-xs text-app-faint">No nodes in pool.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-app-card border ${n.selected ? 'border-blue-500/40 bg-app-cardHover' : 'border-app-border'} hover:border-white/10 p-2.5 rounded-xl flex items-center justify-between gap-2.5 transition">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <input type="checkbox" ${n.selected ? 'checked' : ''} onchange="toggleSelect(${i})"
              class="w-3.5 h-3.5 rounded bg-app-surface border-app-border text-blue-500 focus:ring-0 cursor-pointer accent-blue-500">
            
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${n.ping ? (n.ping < 250 ? 'bg-emerald-400' : 'bg-amber-400') : 'bg-app-faint'}"></span>
                <h3 class="text-xs font-medium ${n.selected ? 'text-app-text' : 'text-app-muted'} truncate">${n.name}</h3>
              </div>
              <p class="text-[10px] text-app-faint font-mono mt-0.5 truncate pl-3">${n.host}</p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <div class="text-right font-mono">
              <div class="text-[11px] font-medium ${n.ping ? (n.ping < 250 ? 'text-emerald-400' : 'text-amber-400') : 'text-app-faint'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[9px] text-app-faint">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode(${i})" title="Copy URI" class="bg-white/[0.04] hover:bg-white/[0.08] text-app-muted hover:text-white p-1.5 rounded-lg text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy text-[10px]"></i>
            </button>
          </div>
        </div>
      `).join('');

      updateSelectionCount();
    }

    function toggleSelect(index) {
      parsedNodes[index].selected = !parsedNodes[index].selected;
      renderNodes();
    }

    function selectPreset(type) {
      if (type === 'all') {
        parsedNodes.forEach(n => n.selected = true);
      } else if (type === 'none') {
        parsedNodes.forEach(n => n.selected = false);
      } else if (type === 'good') {
        parsedNodes.forEach(n => {
          n.selected = (n.ping !== null && n.ping < 350);
        });
      }
      renderNodes();
    }

    function updateSelectionCount() {
      const selected = parsedNodes.filter(n => n.selected).length;
      document.getElementById("selectedCount").innerText = selected;
    }

    function addCustomNode() {
      const input = document.getElementById("customNodeInput");
      const val = input.value.trim();

      if (!val || !val.startsWith("vless://")) {
        showStatus("Invalid vless:// key format", "error");
        return;
      }

      let name = `Custom-${parsedNodes.length + 1}`;
      let host = "custom.edge";
      try {
        if (val.includes('#')) name = decodeURIComponent(val.split('#')[1]);
        const matchHost = val.match(/sni=([^&]+)/) || val.match(/host=([^&]+)/) || val.match(/@([^:]+)/);
        if (matchHost) host = matchHost[1];
      } catch(e) {}

      parsedNodes.unshift({
        id: Date.now(),
        uri: val,
        name: name,
        host: host,
        ping: null,
        speed: null,
        selected: true
      });

      input.value = "";
      document.getElementById("nodeCount").innerText = parsedNodes.length;
      renderNodes();
      showStatus(`Node "${name}" appended to pool`, "success");
    }

    async function testSingleNode(node) {
      const start = performance.now();
      try {
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        const duration = Math.round(performance.now() - start);
        if (duration < 2000) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Testing latency across edge endpoints...", "loading");

      let best = 9999;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        parsedNodes[i].selected = (parsedNodes[i].ping !== null && parsedNodes[i].ping < 450);
        renderNodes();
      }

      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-stopwatch text-[11px]";
      showStatus("Benchmark Complete", "success");
    }

    async function saveFastSubToGithub() {
      const token = document.getElementById("tokenInput").value.trim();
      const selectedUris = parsedNodes.filter(n => n.selected).map(n => n.uri);

      if (!token) {
        showStatus("GitHub PAT required", "error");
        return;
      }

      if (selectedUris.length === 0) {
        showStatus("Select at least 1 node", "error");
        return;
      }

      const saveBtn = document.getElementById("saveFastBtn");
      const saveIcon = document.getElementById("saveFastIcon");
      const saveText = document.getElementById("saveFastText");

      saveBtn.disabled = true;
      saveIcon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      saveText.innerText = "Syncing...";
      showStatus("Pushing payload to fast-sub.txt...", "loading");

      try {
        const base64Content = btoa(selectedUris.join('\n'));
        let sha = null;
        try {
          const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`
            }
          });
          if (fileRes.ok) {
            const fileData = await fileRes.json();
            sha = fileData.sha;
          }
        } catch (e) {}

        const putPayload = {
          message: `chore: update fast-sub.txt with ${selectedUris.length} nodes`,
          content: base64Content,
          branch: "main"
        };
        if (sha) putPayload.sha = sha;

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putPayload)
        });

        if (updateRes.ok) {
          showStatus(`Synced ${selectedUris.length} nodes to fast-sub.txt`, "success");
          document.getElementById("fastSubUrl").value = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/fast-sub.txt?t=${Date.now()}`;
        } else {
          const err = await updateRes.json();
          showStatus(`Error: ${err.message}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error", "error");
      } finally {
        saveBtn.disabled = false;
        saveIcon.className = "fa-solid fa-cloud-arrow-up text-blue-400 text-xs";
        saveText.innerText = "Save Selected to fast-sub.txt";
      }
    }

    function copyLink(inputId, btnId) {
      const input = document.getElementById(inputId);
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById(btnId);
      btn.innerText = "Copied";
      setTimeout(() => btn.innerText = "Copy", 2000);
      showStatus("Link copied to clipboard", "success");
    }

    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`Copied "${node.name}" key`, "success");
    }

    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("PAT Token required", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Dispatching GitHub Workflow...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Scraper dispatched! Pool will refresh in ~15s", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger failed. Verify PAT permissions.", "error");
        }
      } catch (err) {
        showStatus("Network Error", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-arrows-rotate text-[11px]";
      }
    }

    fetchAndParseNodes();
  </script>
</body>
</html>
