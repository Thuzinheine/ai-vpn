<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=SF+Pro+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'sans-serif'],
            mono: ['SF Mono', 'JetBrains Mono', 'Menlo', 'monospace'],
          },
          colors: {
            apple: {
              bg: '#000000',
              secondaryBg: '#1c1c1e',
              tertiaryBg: '#2c2c2e',
              card: 'rgba(28, 28, 30, 0.72)',
              border: 'rgba(255, 255, 255, 0.12)',
              subtleBorder: 'rgba(255, 255, 255, 0.08)',
              blue: '#0a84ff',
              blueHover: '#0071e3',
              green: '#30d158',
              orange: '#ff9f0a',
              red: '#ff453a',
              textPrimary: '#ffffff',
              textSecondary: '#8e8e93',
              textTertiary: '#636366',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .apple-glass {
      background: rgba(28, 28, 30, 0.65);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .apple-sub-panel {
      background: rgba(44, 44, 46, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .apple-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .apple-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .apple-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
    }
    .apple-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-8 flex flex-col justify-between selection:bg-apple-blue/30 selection:text-white">

  <!-- Apple Centered Max-Width Viewport -->
  <div class="max-w-6xl w-full mx-auto space-y-4 flex-1 flex flex-col">

    <!-- Top Navigation Header -->
    <header class="apple-glass rounded-2xl px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-apple-secondaryBg border border-apple-subtleBorder flex items-center justify-center text-apple-blue">
          <i class="fa-solid fa-network-wired text-sm"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-[15px] font-semibold text-white tracking-tight">VPN Subscriptions</h1>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-white/10 text-apple-textSecondary">
              Edge Core
            </span>
          </div>
          <p class="text-[12px] text-apple-textSecondary">Smart Subscription Manager & Latency Monitor</p>
        </div>
      </div>

      <!-- Quick Apple Status Pills -->
      <div class="flex items-center gap-2 text-[12px]">
        <div class="apple-sub-panel px-3.5 py-1.5 rounded-xl flex items-center gap-2">
          <span class="text-apple-textTertiary font-medium">Selected</span>
          <span id="selectedCount" class="font-semibold text-apple-blue font-mono">0</span>
          <span class="text-apple-textTertiary">/</span>
          <span id="nodeCount" class="font-medium text-apple-textSecondary font-mono">0</span>
        </div>
        <div class="apple-sub-panel px-3.5 py-1.5 rounded-xl flex items-center gap-2">
          <span class="text-apple-textTertiary font-medium">Best Ping</span>
          <span id="bestPing" class="font-semibold text-apple-green font-mono">-- ms</span>
        </div>
      </div>
    </header>

    <!-- Main Apple 2-Column Split Workspace -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1 items-stretch">
      
      <!-- Left Column: Controls (Col Span 5) -->
      <section class="lg:col-span-5 flex flex-col gap-4">
        
        <!-- Controls Card -->
        <div class="apple-glass rounded-2xl p-5 space-y-4 flex-1">
          
          <!-- Official sub.txt Link -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-center text-[12px]">
              <span class="font-medium text-white flex items-center gap-1.5">
                <i class="fa-solid fa-globe text-apple-textSecondary text-[11px]"></i> All Nodes Sub
              </span>
              <span class="text-[11px] text-apple-textTertiary font-mono">sub.txt</span>
            </div>
            <div class="flex items-center gap-2 bg-apple-secondaryBg border border-apple-subtleBorder rounded-xl p-1.5 focus-within:border-apple-blue/50 transition">
              <input type="text" id="officialSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
                class="w-full bg-transparent border-0 px-2.5 text-[11px] text-apple-textSecondary font-mono truncate select-all focus:outline-none">
              <button onclick="copyLink('officialSubUrl', 'copyOfficialBtn')" class="bg-apple-tertiaryBg hover:bg-white/15 active:scale-95 text-white px-3 py-1.5 rounded-lg text-[11px] font-medium transition flex items-center gap-1">
                <i class="fa-regular fa-copy text-[10px]"></i>
                <span id="copyOfficialBtn">Copy</span>
              </button>
            </div>
          </div>

          <!-- fast-sub.txt Link -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-center text-[12px]">
              <span class="font-medium text-white flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-apple-blue text-[11px]"></i> Fast Nodes Sub
              </span>
              <span class="text-[11px] text-apple-textTertiary font-mono">fast-sub.txt</span>
            </div>
            <div class="flex items-center gap-2 bg-apple-secondaryBg border border-apple-subtleBorder rounded-xl p-1.5 focus-within:border-apple-blue/50 transition">
              <input type="text" id="fastSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/fast-sub.txt"
                class="w-full bg-transparent border-0 px-2.5 text-[11px] text-apple-blue font-mono truncate select-all focus:outline-none">
              <button onclick="copyLink('fastSubUrl', 'copyFastBtn')" class="bg-apple-tertiaryBg hover:bg-white/15 active:scale-95 text-white px-3 py-1.5 rounded-lg text-[11px] font-medium transition flex items-center gap-1">
                <i class="fa-regular fa-copy text-[10px]"></i>
                <span id="copyFastBtn">Copy</span>
              </button>
            </div>
          </div>

          <!-- PAT Key Input -->
          <div class="space-y-1.5 pt-1">
            <label class="text-[12px] font-medium text-apple-textSecondary flex items-center gap-1.5">
              <i class="fa-solid fa-key text-[11px]"></i> GitHub Token (PAT)
            </label>
            <div class="relative">
              <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
                class="w-full bg-apple-secondaryBg border border-apple-subtleBorder rounded-xl pl-3 pr-9 py-2 text-[12px] text-white placeholder-apple-textTertiary focus:outline-none focus:border-apple-blue font-mono transition">
              <button type="button" onclick="toggleTokenVisibility()" class="absolute right-3 top-2.5 text-apple-textSecondary hover:text-white">
                <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Apple Action Buttons -->
          <div class="space-y-2.5 pt-2">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="triggerGithubUpdate()" id="updateBtn"
                class="bg-apple-secondaryBg hover:bg-apple-tertiaryBg border border-apple-subtleBorder text-white font-medium py-2.5 rounded-xl text-[12px] flex items-center justify-center gap-2 active:scale-98 transition">
                <i id="btnIcon" class="fa-solid fa-arrow-rotate-right text-[11px]"></i>
                <span>Scrape Pool</span>
              </button>

              <button onclick="runBenchmarkAll()" id="benchmarkBtn"
                class="bg-apple-blue hover:bg-apple-blueHover text-white font-medium py-2.5 rounded-xl text-[12px] flex items-center justify-center gap-2 active:scale-98 transition shadow-sm">
                <i id="testIcon" class="fa-solid fa-stopwatch text-[11px]"></i>
                <span>Benchmark</span>
              </button>
            </div>

            <button onclick="saveFastSubToGithub()" id="saveFastBtn"
              class="w-full bg-apple-secondaryBg hover:bg-apple-tertiaryBg border border-apple-subtleBorder text-white font-medium py-2.5 rounded-xl text-[12px] flex items-center justify-center gap-2 active:scale-98 transition">
              <i id="saveFastIcon" class="fa-solid fa-cloud-arrow-up text-[11px] text-apple-blue"></i>
              <span id="saveFastText">Save to fast-sub.txt</span>
            </button>
          </div>

          <!-- Toast Status Notification -->
          <div id="statusBox" class="hidden p-3 rounded-xl text-[12px] flex items-center gap-2.5 border transition-all">
            <i id="statusIcon" class="fa-solid fa-circle-info text-xs"></i>
            <span id="statusMessage" class="leading-tight"></span>
          </div>

        </div>

        <!-- External Key Form -->
        <div class="apple-glass rounded-2xl p-4 space-y-2">
          <label class="text-[12px] font-medium text-apple-textSecondary flex items-center gap-1.5">
            <i class="fa-solid fa-plus text-[11px]"></i> Add External VLESS Key
          </label>
          <div class="flex gap-2">
            <input type="text" id="customNodeInput" placeholder="vless://..."
              class="w-full bg-apple-secondaryBg border border-apple-subtleBorder rounded-xl px-3 py-2 text-[12px] text-white placeholder-apple-textTertiary focus:outline-none focus:border-apple-blue font-mono transition">
            <button onclick="addCustomNode()" class="bg-apple-secondaryBg hover:bg-apple-tertiaryBg border border-apple-subtleBorder text-white px-4 py-2 rounded-xl text-[12px] font-medium active:scale-95 transition">
              Add
            </button>
          </div>
        </div>

      </section>

      <!-- Right Column: Nodes Pool (Col Span 7) -->
      <section class="lg:col-span-7 apple-glass rounded-2xl p-5 flex flex-col h-[680px]">
        
        <!-- Selection Header & Filter Pills -->
        <div class="flex flex-wrap items-center justify-between gap-2 pb-3.5 border-b border-apple-subtleBorder flex-shrink-0">
          <div class="flex items-center gap-2">
            <h2 class="text-[13px] font-semibold text-white tracking-tight">Active Node Pool</h2>
          </div>

          <!-- Apple Segmented-style Preset Filter -->
          <div class="flex items-center gap-1 bg-apple-secondaryBg p-1 rounded-xl border border-apple-subtleBorder text-[11px]">
            <button onclick="selectPreset('all')" class="hover:bg-white/10 text-white px-2.5 py-1 rounded-lg transition font-medium">All</button>
            <button onclick="selectPreset('good')" class="hover:bg-white/10 text-apple-blue px-2.5 py-1 rounded-lg transition font-medium">&lt; 350ms</button>
            <button onclick="selectPreset('none')" class="hover:bg-white/10 text-apple-textSecondary px-2.5 py-1 rounded-lg transition font-medium">Clear</button>
            <button onclick="fetchAndParseNodes()" title="Reload from GitHub" class="text-apple-textSecondary hover:text-white px-2 py-1 rounded-lg transition">
              <i class="fa-solid fa-arrow-rotate-right text-[10px]"></i>
            </button>
          </div>
        </div>

        <!-- Scrollable Apple Cards Container -->
        <div id="nodeListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3 overflow-y-auto pr-1 flex-1 apple-scroll content-start">
          <div class="col-span-full text-center py-20 text-[12px] text-apple-textTertiary">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading active nodes...
          </div>
        </div>
      </section>

    </main>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-3 rounded-xl text-[12px] flex items-center gap-2.5 border transition-all ";
      if (type === "success") {
        box.classList.add("bg-apple-secondaryBg", "border-apple-green/30", "text-apple-green");
        icon.className = "fa-solid fa-check text-xs text-apple-green";
      } else if (type === "error") {
        box.classList.add("bg-apple-secondaryBg", "border-apple-red/30", "text-apple-red");
        icon.className = "fa-solid fa-triangle-exclamation text-xs text-apple-red";
      } else {
        box.classList.add("bg-apple-secondaryBg", "border-apple-subtleBorder", "text-apple-textSecondary");
        icon.className = "fa-solid fa-circle-notch fa-spin text-xs text-apple-blue";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="col-span-full text-center py-20 text-[12px] text-apple-textTertiary"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { id: idx, uri, name, host, ping: null, speed: null, selected: true };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="col-span-full text-center py-20 text-[12px] text-apple-red">Unable to load sub.txt</div>`;
      }
    }

    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="col-span-full text-center py-20 text-[12px] text-apple-textTertiary">No nodes available.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-apple-secondaryBg border ${n.selected ? 'border-apple-blue/40' : 'border-apple-subtleBorder'} hover:border-white/20 p-2.5 rounded-xl flex items-center justify-between gap-2.5 transition h-[60px]">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <input type="checkbox" ${n.selected ? 'checked' : ''} onchange="toggleSelect(${i})"
              class="w-4 h-4 rounded-md bg-apple-tertiaryBg border-apple-subtleBorder text-apple-blue focus:ring-0 cursor-pointer accent-apple-blue">
            
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${n.ping ? (n.ping < 250 ? 'bg-apple-green' : 'bg-apple-orange') : 'bg-apple-textTertiary'}"></span>
                <h3 class="text-[12px] font-medium ${n.selected ? 'text-white' : 'text-apple-textSecondary'} truncate">${n.name}</h3>
              </div>
              <p class="text-[10px] text-apple-textTertiary font-mono mt-0.5 truncate pl-3">${n.host}</p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <div class="text-right font-mono">
              <div class="text-[11px] font-medium ${n.ping ? (n.ping < 250 ? 'text-apple-green' : 'text-apple-orange') : 'text-apple-textTertiary'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[9px] text-apple-textTertiary">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode(${i})" title="Copy key" class="bg-apple-tertiaryBg hover:bg-white/20 text-apple-textSecondary hover:text-white p-1.5 rounded-lg text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>
      `).join('');

      updateSelectionCount();
    }

    function toggleSelect(index) {
      parsedNodes[index].selected = !parsedNodes[index].selected;
      renderNodes();
    }

    function selectPreset(type) {
      if (type === 'all') {
        parsedNodes.forEach(n => n.selected = true);
      } else if (type === 'none') {
        parsedNodes.forEach(n => n.selected = false);
      } else if (type === 'good') {
        parsedNodes.forEach(n => {
          n.selected = (n.ping !== null && n.ping < 350);
        });
      }
      renderNodes();
    }

    function updateSelectionCount() {
      const selected = parsedNodes.filter(n => n.selected).length;
      document.getElementById("selectedCount").innerText = selected;
    }

    function addCustomNode() {
      const input = document.getElementById("customNodeInput");
      const val = input.value.trim();

      if (!val || !val.startsWith("vless://")) {
        showStatus("Please enter a valid vless:// URI", "error");
        return;
      }

      let name = `Custom-${parsedNodes.length + 1}`;
      let host = "custom.edge";
      try {
        if (val.includes('#')) name = decodeURIComponent(val.split('#')[1]);
        const matchHost = val.match(/sni=([^&]+)/) || val.match(/host=([^&]+)/) || val.match(/@([^:]+)/);
        if (matchHost) host = matchHost[1];
      } catch(e) {}

      parsedNodes.unshift({
        id: Date.now(),
        uri: val,
        name: name,
        host: host,
        ping: null,
        speed: null,
        selected: true
      });

      input.value = "";
      document.getElementById("nodeCount").innerText = parsedNodes.length;
      renderNodes();
      showStatus(`Added "${name}" to selection`, "success");
    }

    async function testSingleNode(node) {
      const start = performance.now();
      try {
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        const duration = Math.round(performance.now() - start);
        if (duration < 2000) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Benchmarking nodes...", "loading");

      let best = 9999;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        parsedNodes[i].selected = (parsedNodes[i].ping !== null && parsedNodes[i].ping < 450);
        renderNodes();
      }

      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-stopwatch text-[11px]";
      showStatus("Benchmark Complete", "success");
    }

    async function saveFastSubToGithub() {
      const token = document.getElementById("tokenInput").value.trim();
      const selectedUris = parsedNodes.filter(n => n.selected).map(n => n.uri);

      if (!token) {
        showStatus("GitHub Token (PAT) required", "error");
        return;
      }

      if (selectedUris.length === 0) {
        showStatus("Select at least 1 node", "error");
        return;
      }

      const saveBtn = document.getElementById("saveFastBtn");
      const saveIcon = document.getElementById("saveFastIcon");
      const saveText = document.getElementById("saveFastText");

      saveBtn.disabled = true;
      saveIcon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      saveText.innerText = "Saving...";
      showStatus("Updating fast-sub.txt on GitHub...", "loading");

      try {
        const base64Content = btoa(selectedUris.join('\n'));
        let sha = null;
        try {
          const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`
            }
          });
          if (fileRes.ok) {
            const fileData = await fileRes.json();
            sha = fileData.sha;
          }
        } catch (e) {}

        const putPayload = {
          message: `Update fast-sub.txt (${selectedUris.length} nodes)`,
          content: base64Content,
          branch: "main"
        };
        if (sha) putPayload.sha = sha;

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putPayload)
        });

        if (updateRes.ok) {
          showStatus(`Saved ${selectedUris.length} nodes to fast-sub.txt`, "success");
          document.getElementById("fastSubUrl").value = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/fast-sub.txt?t=${Date.now()}`;
        } else {
          const err = await updateRes.json();
          showStatus(`Error: ${err.message}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error", "error");
      } finally {
        saveBtn.disabled = false;
        saveIcon.className = "fa-solid fa-cloud-arrow-up text-[11px] text-apple-blue";
        saveText.innerText = "Save to fast-sub.txt";
      }
    }

    function copyLink(inputId, btnId) {
      const input = document.getElementById(inputId);
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById(btnId);
      btn.innerText = "Copied";
      setTimeout(() => btn.innerText = "Copy", 2000);
      showStatus("Link copied to clipboard", "success");
    }

    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`Copied "${node.name}"`, "success");
    }

    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("PAT Token required", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Triggering GitHub Action...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Workflow dispatched. Refreshing pool...", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger failed", "error");
        }
      } catch (err) {
        showStatus("Network Error", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-arrow-rotate-right text-[11px]";
      }
    }

    fetchAndParseNodes();
  </script>
</body>
</html>
