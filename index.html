<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VPN | Edge Gateway Core & Tester</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            mint: {
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              neon: '#00ff9d',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #060b09;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 255, 157, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
    }
    .neon-card {
      background: rgba(10, 18, 14, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .neon-glow-btn {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
      transition: all 0.25s ease;
    }
    .neon-glow-btn:hover {
      box-shadow: 0 0 30px rgba(0, 255, 157, 0.55);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(52, 211, 153, 0.25);
      border-radius: 10px;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen p-4 sm:p-6 selection:bg-mint-neon selection:text-black flex justify-center">

  <div class="w-full max-w-2xl space-y-5">
    
    <!-- Header Card -->
    <div class="neon-card rounded-3xl p-6 relative overflow-hidden">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 via-mint-neon to-emerald-600 p-[1px] shadow-lg shadow-emerald-500/20">
            <div class="w-full h-full bg-[#08120d] rounded-2xl flex items-center justify-center">
              <i class="fa-solid fa-gauge-high text-mint-neon text-xl drop-shadow-[0_0_8px_rgba(0,255,157,0.8)]"></i>
            </div>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-bold tracking-tight text-white">AI-VPN Core & Benchmark</h1>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-mint-neon border border-emerald-500/30">
                Live
              </span>
            </div>
            <p class="text-xs text-emerald-100/60 mt-0.5">Latency Ping, Speed Check & Auto-Refresh</p>
          </div>
        </div>

        <button onclick="fetchAndParseNodes()" class="text-xs bg-[#0c1a13] hover:bg-[#12281d] border border-emerald-500/30 text-mint-neon px-3.5 py-2 rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i>
          <span>Reload List</span>
        </button>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-3 gap-2.5 mt-5 pt-4 border-t border-emerald-500/15">
        <div class="bg-[#09150f]/80 p-2.5 rounded-2xl border border-emerald-500/15 text-center">
          <span class="text-[10px] uppercase font-semibold text-emerald-300/60 block">Loaded Nodes</span>
          <span id="nodeCount" class="text-sm font-bold text-mint-neon">0</span>
        </div>
        <div class="bg-[#09150f]/80 p-2.5 rounded-2xl border border-emerald-500/15 text-center">
          <span class="text-[10px] uppercase font-semibold text-emerald-300/60 block">Best Latency</span>
          <span id="bestPing" class="text-sm font-bold text-emerald-300">-- ms</span>
        </div>
        <div class="bg-[#09150f]/80 p-2.5 rounded-2xl border border-emerald-500/15 text-center">
          <span class="text-[10px] uppercase font-semibold text-emerald-300/60 block">Est. Speed</span>
          <span id="avgSpeed" class="text-sm font-bold text-emerald-400">-- Mbps</span>
        </div>
      </div>
    </div>

    <!-- Actions Control Panel -->
    <div class="neon-card rounded-3xl p-6 space-y-4">
      
      <!-- Token Input Section -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <label class="text-emerald-200/90 font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i> GitHub Token (PAT)
          </label>
          <span class="text-[11px] text-emerald-200/40">Browser Memory</span>
        </div>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
          class="w-full bg-[#08130e] border border-emerald-500/25 rounded-2xl px-4 py-2.5 text-xs text-emerald-100 placeholder-emerald-900/60 focus:outline-none focus:border-mint-neon font-mono">
      </div>

      <!-- Buttons Grid (Update & Test) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
        <button onclick="triggerGithubUpdate()" id="updateBtn"
          class="bg-gradient-to-r from-emerald-500 to-mint-neon text-slate-950 font-bold py-3 px-4 rounded-2xl neon-glow-btn flex items-center justify-center gap-2 cursor-pointer text-xs uppercase tracking-wide">
          <i id="btnIcon" class="fa-solid fa-cloud-arrow-down"></i>
          <span>Scrape New Nodes</span>
        </button>

        <button onclick="runBenchmarkAll()" id="benchmarkBtn"
          class="bg-[#0d1e15] hover:bg-[#132c1f] border border-mint-neon/40 text-mint-neon font-bold py-3 px-4 rounded-2xl flex items-center justify-center gap-2 cursor-pointer text-xs uppercase tracking-wide transition">
          <i id="testIcon" class="fa-solid fa-bolt"></i>
          <span>Test Ping & Speed</span>
        </button>
      </div>

      <!-- Status Toast Box -->
      <div id="statusBox" class="hidden p-3 rounded-2xl text-xs flex items-center gap-2.5 border transition-all duration-300">
        <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin text-sm"></i>
        <span id="statusMessage"></span>
      </div>

      <!-- Sub URL Box -->
      <div class="space-y-1.5 pt-3 border-t border-emerald-500/15">
        <div class="flex items-center gap-2 bg-[#08130e] border border-emerald-500/25 rounded-2xl p-2">
          <input type="text" id="subUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
            class="w-full bg-transparent border-0 px-2 text-xs text-mint-neon font-mono tracking-tight select-all focus:outline-none truncate">
          <button onclick="copySubLink()" id="copyBtn" class="bg-emerald-500/15 hover:bg-emerald-500/25 text-mint-neon border border-emerald-500/30 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-regular fa-copy"></i>
            <span id="copyText">Copy</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Node Benchmark List Cards -->
    <div class="neon-card rounded-3xl p-6 space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-emerald-500/15">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-network-wired text-mint-neon"></i>
          <span>Nodes Benchmark List</span>
        </h2>
        <span class="text-[11px] text-emerald-400/60 font-mono">Sorted by Latency</span>
      </div>

      <!-- Nodes Scrollable Area -->
      <div id="nodeListContainer" class="space-y-2 max-h-96 overflow-y-auto pr-1 custom-scroll">
        <div class="text-center py-8 text-xs text-emerald-400/50">
          <i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading active nodes from GitHub...
        </div>
      </div>
    </div>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-3 rounded-2xl text-xs flex items-center gap-2.5 border transition-all duration-300 ";
      if (type === "success") {
        box.classList.add("bg-emerald-500/15", "border-emerald-500/40", "text-mint-neon");
        icon.className = "fa-solid fa-circle-check text-base text-mint-neon";
      } else if (type === "error") {
        box.classList.add("bg-rose-500/15", "border-rose-500/40", "text-rose-300");
        icon.className = "fa-solid fa-circle-exclamation text-base text-rose-400";
      } else {
        box.classList.add("bg-emerald-500/10", "border-emerald-500/30", "text-emerald-200");
        icon.className = "fa-solid fa-circle-notch fa-spin text-base text-mint-neon";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    // ၁။ Fetch sub.txt and Parse VLESS nodes
    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="text-center py-6 text-xs text-emerald-400/60"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Fetching latest sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { uri, name, host, ping: null, speed: null };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="text-center py-6 text-xs text-rose-400">Failed to load nodes. Make sure sub.txt exists!</div>`;
      }
    }

    // ၂။ Render Node Cards
    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">No VLESS nodes found.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-[#08130e]/90 border border-emerald-500/15 hover:border-emerald-500/40 p-3 rounded-2xl flex items-center justify-between gap-3 transition">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full ${n.ping ? (n.ping < 250 ? 'bg-mint-neon' : 'bg-amber-400') : 'bg-slate-600'}"></span>
              <h3 class="text-xs font-bold text-white truncate">${n.name}</h3>
            </div>
            <p class="text-[10px] text-emerald-400/50 font-mono mt-0.5 truncate">${n.host}</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="text-xs font-mono font-bold ${n.ping ? (n.ping < 200 ? 'text-mint-neon' : 'text-amber-300') : 'text-slate-500'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[10px] text-emerald-300/60 font-mono">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode('${i}')" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-mint-neon border border-emerald-500/30 p-2 rounded-xl text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    // ၃။ Latency & Speed Benchmark Function
    async function testSingleNode(node) {
      const start = performance.now();
      try {
        // Test Endpoint via Cloudflare / Edge domain
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        // Estimated Speed based on latency ratio
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        // Fallback Ping measurement
        const duration = Math.round(performance.now() - start);
        if (duration < 2500) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin";
      showStatus("Nodes များအားလုံးကို Ping နှင့် Speed စစ်ဆေးနေပါသည်...", "loading");

      let best = 9999;
      let totalSpeed = 0;
      let count = 0;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        if (parsedNodes[i].speed) {
          totalSpeed += parseFloat(parsedNodes[i].speed);
          count++;
        }
        renderNodes();
      }

      // Sort by best ping
      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";
      document.getElementById("avgSpeed").innerText = count > 0 ? `${(totalSpeed / count).toFixed(1)} MB/s` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-bolt";
      showStatus("Benchmark စစ်ဆေးခြင်း အောင်မြင်စွာ ပြီးဆုံးပါပြီ!", "success");
    }

    // ၄။ Copy Helpers
    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`"${node.name}" key ကို Copy ကူးပြီးပါပြီ!`, "success");
    }

    function copySubLink() {
      const input = document.getElementById("subUrl");
      input.select();
      navigator.clipboard.writeText(input.value);
      const copyText = document.getElementById("copyText");
      copyText.innerText = "Copied!";
      setTimeout(() => copyText.innerText = "Copy", 2000);
    }

    // ၅။ Trigger GitHub Actions
    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("GitHub Access Token (PAT) အရင် ထည့်ပေးပါ!", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin";
      showStatus("GitHub Actions သို့ အချက်ပြနေပါသည်...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Scraping စတင် run နေပါပြီ! ၁ မိနစ်အတွင်း Reload ပြန်လုပ်ပါခင်ဗျာ။", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger မအောင်မြင်ပါ။ Token အခွင့်အရေး စစ်ဆေးပေးပါ။", "error");
        }
      } catch (err) {
        showStatus("Network Error ဖြစ်ပေါ်နေပါသည်။", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-cloud-arrow-down";
      }
    }

    // Initial load
    fetchAndParseNodes();
  </script>
</body>
</html>
