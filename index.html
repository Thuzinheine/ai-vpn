<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Plus Jakarta Sans', 'Helvetica Neue', 'sans-serif'],
            mono: ['SF Mono', 'JetBrains Mono', 'Menlo', 'monospace'],
          },
          colors: {
            ios: {
              bg: '#f8fafc',
              card: '#ffffff',
              border: '#e2e8f0',
              borderLight: '#f1f5f9',
              blue: '#0284c7',
              blueHover: '#0369a1',
              green: '#16a34a',
              textPrimary: '#0f172a',
              textSecondary: '#64748b',
              textMuted: '#94a3b8'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .clean-shadow {
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    }
    .clean-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .clean-scroll::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    .clean-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .clean-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex justify-center selection:bg-ios-blue/15 selection:text-ios-blue">

  <div class="max-w-3xl w-full space-y-6">

    <!-- Header Section -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-2 border-b border-ios-border">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-ios-textPrimary flex items-center gap-2">
          <span>AI VPN Studio</span>
          <span class="text-[11px] font-semibold font-mono px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
            v2.6
          </span>
        </h1>
        <p class="text-xs text-ios-textSecondary mt-0.5">Automated Node Aggregation & Latency Tuning Hub</p>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <div class="bg-white border border-ios-border px-3 py-1.5 rounded-xl flex items-center gap-2 clean-shadow">
          <span class="text-ios-textMuted font-medium">Selected</span>
          <span id="selectedCount" class="font-bold text-ios-blue font-mono">0</span>
          <span class="text-slate-300">/</span>
          <span id="nodeCount" class="font-medium text-slate-600 font-mono">0</span>
        </div>
        <div class="bg-white border border-ios-border px-3 py-1.5 rounded-xl flex items-center gap-2 clean-shadow">
          <span class="text-ios-textMuted font-medium">Best Latency</span>
          <span id="bestPing" class="font-bold text-ios-green font-mono">-- ms</span>
        </div>
      </div>
    </header>

    <!-- Subscription Links Card -->
    <section class="bg-ios-card border border-ios-border rounded-2xl p-5 space-y-4 clean-shadow">
      <div class="flex items-center justify-between pb-2 border-b border-ios-borderLight">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Subscription Endpoints</span>
        <span class="text-[11px] text-slate-400">Direct GitHub Raw</span>
      </div>

      <!-- Main sub.txt -->
      <div class="space-y-1">
        <div class="flex justify-between items-center text-xs">
          <label class="font-medium text-slate-700">Official Pool (50 Nodes Auto)</label>
          <span class="text-[11px] text-slate-400 font-mono">sub.txt</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-50 border border-ios-border rounded-xl p-1.5">
          <input type="text" id="officialSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
            class="w-full bg-transparent border-0 px-2 text-xs text-slate-600 font-mono truncate select-all focus:outline-none">
          <button onclick="copyLink('officialSubUrl', 'copyOfficialBtn')" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium clean-shadow transition active:scale-95 flex items-center gap-1">
            <i class="fa-regular fa-copy text-[11px]"></i>
            <span id="copyOfficialBtn">Copy</span>
          </button>
        </div>
      </div>

      <!-- fast-sub.txt -->
      <div class="space-y-1">
        <div class="flex justify-between items-center text-xs">
          <label class="font-medium text-ios-blue">Fast Pool (Custom Benchmarked)</label>
          <span class="text-[11px] text-ios-blue/70 font-mono">fast-sub.txt</span>
        </div>
        <div class="flex items-center gap-2 bg-sky-50/50 border border-sky-100 rounded-xl p-1.5">
          <input type="text" id="fastSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/fast-sub.txt"
            class="w-full bg-transparent border-0 px-2 text-xs text-ios-blue font-mono truncate select-all focus:outline-none">
          <button onclick="copyLink('fastSubUrl', 'copyFastBtn')" class="bg-white hover:bg-sky-50 text-ios-blue border border-sky-200 px-3 py-1.5 rounded-lg text-xs font-semibold clean-shadow transition active:scale-95 flex items-center gap-1">
            <i class="fa-regular fa-copy text-[11px]"></i>
            <span id="copyFastBtn">Copy</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Controls & Operations Card -->
    <section class="bg-ios-card border border-ios-border rounded-2xl p-5 space-y-4 clean-shadow">
      
      <!-- PAT Token -->
      <div class="space-y-1.5">
        <label class="text-xs font-medium text-slate-600 flex items-center gap-1.5">
          <i class="fa-solid fa-key text-slate-400"></i> GitHub Token (PAT)
        </label>
        <div class="relative">
          <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
            class="w-full bg-slate-50 border border-ios-border rounded-xl pl-3 pr-9 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-ios-blue focus:bg-white font-mono transition">
          <button type="button" onclick="toggleTokenVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
            <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Action Buttons Toolbar -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1">
        <button onclick="triggerGithubUpdate()" id="updateBtn"
          class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 clean-shadow active:scale-95 transition">
          <i id="btnIcon" class="fa-solid fa-arrows-rotate text-xs text-slate-500"></i>
          <span>Scrape Pool</span>
        </button>

        <button onclick="runBenchmarkAll()" id="benchmarkBtn"
          class="bg-ios-blue hover:bg-ios-blueHover text-white font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 clean-shadow active:scale-95 transition">
          <i id="testIcon" class="fa-solid fa-stopwatch text-xs"></i>
          <span>Test Latency</span>
        </button>

        <button onclick="saveFastSubToGithub()" id="saveFastBtn"
          class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 clean-shadow active:scale-95 transition">
          <i id="saveFastIcon" class="fa-solid fa-cloud-arrow-up text-xs"></i>
          <span id="saveFastText">Save fast-sub.txt</span>
        </button>
      </div>

      <!-- Status Toast Message -->
      <div id="statusBox" class="hidden p-3 rounded-xl text-xs flex items-center gap-2 border transition-all">
        <i id="statusIcon" class="fa-solid fa-circle-info text-xs"></i>
        <span id="statusMessage" class="leading-tight font-medium"></span>
      </div>

      <!-- External Key Input Field -->
      <div class="pt-3 border-t border-ios-borderLight space-y-1.5">
        <label class="text-xs font-medium text-slate-600">Add External VLESS Key</label>
        <div class="flex gap-2">
          <input type="text" id="customNodeInput" placeholder="vless://..."
            class="w-full bg-slate-50 border border-ios-border rounded-xl px-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-ios-blue focus:bg-white font-mono transition">
          <button onclick="addCustomNode()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-4 py-2 rounded-xl text-xs font-semibold active:scale-95 transition">
            Add
          </button>
        </div>
      </div>
    </section>

    <!-- Node Selection Pool -->
    <section class="bg-ios-card border border-ios-border rounded-2xl p-5 space-y-3.5 clean-shadow">
      
      <!-- List Filter Toolbar -->
      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-ios-borderLight">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700">Node Selection Pool</h2>

        <div class="flex items-center gap-1.5 text-xs">
          <span class="text-slate-400 text-[11px]">Filter:</span>
          <button onclick="selectPreset('all')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-medium transition">All</button>
          <button onclick="selectPreset('good')" class="bg-sky-50 hover:bg-sky-100 text-ios-blue px-2.5 py-1 rounded-lg text-xs font-medium transition">&lt; 350ms</button>
          <button onclick="selectPreset('none')" class="bg-slate-100 hover:bg-slate-200 text-slate-500 px-2.5 py-1 rounded-lg text-xs font-medium transition">Clear</button>
          <button onclick="fetchAndParseNodes()" title="Reload from GitHub" class="text-slate-400 hover:text-slate-700 ml-1 p-1 transition">
            <i class="fa-solid fa-rotate-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Nodes List Container (Vertical Stack, No Narrow Cramping) -->
      <div id="nodeListContainer" class="space-y-2 max-h-[500px] overflow-y-auto pr-1 clean-scroll">
        <div class="text-center py-16 text-xs text-slate-400">
          <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading active nodes...
        </div>
      </div>
    </section>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-3 rounded-xl text-xs flex items-center gap-2 border transition-all ";
      if (type === "success") {
        box.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-700");
        icon.className = "fa-solid fa-circle-check text-xs text-emerald-600";
      } else if (type === "error") {
        box.classList.add("bg-rose-50", "border-rose-200", "text-rose-700");
        icon.className = "fa-solid fa-circle-exclamation text-xs text-rose-600";
      } else {
        box.classList.add("bg-slate-50", "border-slate-200", "text-slate-600");
        icon.className = "fa-solid fa-circle-notch fa-spin text-xs text-ios-blue";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="text-center py-16 text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { id: idx, uri, name, host, ping: null, speed: null, selected: true };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="text-center py-16 text-xs text-rose-500">Failed to load sub.txt</div>`;
      }
    }

    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="text-center py-16 text-xs text-slate-400">No nodes found.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-white border ${n.selected ? 'border-sky-300 bg-sky-50/20' : 'border-ios-border'} hover:border-slate-300 px-3.5 py-2.5 rounded-xl flex items-center justify-between gap-3 clean-shadow transition">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <input type="checkbox" ${n.selected ? 'checked' : ''} onchange="toggleSelect(${i})"
              class="w-4 h-4 rounded border-slate-300 text-ios-blue focus:ring-0 cursor-pointer accent-ios-blue">
            
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full flex-shrink-0 ${n.ping ? (n.ping < 250 ? 'bg-emerald-500' : 'bg-amber-500') : 'bg-slate-300'}"></span>
                <h3 class="text-xs font-semibold ${n.selected ? 'text-slate-800' : 'text-slate-500'} truncate">${n.name}</h3>
              </div>
              <p class="text-[11px] text-slate-400 font-mono mt-0.5 truncate pl-4">${n.host}</p>
            </div>
          </div>

          <div class="flex items-center gap-3 flex-shrink-0">
            <div class="text-right font-mono">
              <div class="text-xs font-bold ${n.ping ? (n.ping < 250 ? 'text-emerald-600' : 'text-amber-600') : 'text-slate-400'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[10px] text-slate-400">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode(${i})" title="Copy key" class="bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 p-2 rounded-lg text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>
      `).join('');

      updateSelectionCount();
    }

    function toggleSelect(index) {
      parsedNodes[index].selected = !parsedNodes[index].selected;
      renderNodes();
    }

    function selectPreset(type) {
      if (type === 'all') {
        parsedNodes.forEach(n => n.selected = true);
      } else if (type === 'none') {
        parsedNodes.forEach(n => n.selected = false);
      } else if (type === 'good') {
        parsedNodes.forEach(n => {
          n.selected = (n.ping !== null && n.ping < 350);
        });
      }
      renderNodes();
    }

    function updateSelectionCount() {
      const selected = parsedNodes.filter(n => n.selected).length;
      document.getElementById("selectedCount").innerText = selected;
    }

    function addCustomNode() {
      const input = document.getElementById("customNodeInput");
      const val = input.value.trim();

      if (!val || !val.startsWith("vless://")) {
        showStatus("vless:// key အပြည့်အစုံ ထည့်ပေးပါ", "error");
        return;
      }

      let name = `Custom-${parsedNodes.length + 1}`;
      let host = "custom.edge";
      try {
        if (val.includes('#')) name = decodeURIComponent(val.split('#')[1]);
        const matchHost = val.match(/sni=([^&]+)/) || val.match(/host=([^&]+)/) || val.match(/@([^:]+)/);
        if (matchHost) host = matchHost[1];
      } catch(e) {}

      parsedNodes.unshift({
        id: Date.now(),
        uri: val,
        name: name,
        host: host,
        ping: null,
        speed: null,
        selected: true
      });

      input.value = "";
      document.getElementById("nodeCount").innerText = parsedNodes.length;
      renderNodes();
      showStatus(`Node "${name}" ကို ထည့်သွင်းပြီးပါပြီ`, "success");
    }

    async function testSingleNode(node) {
      const start = performance.now();
      try {
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        const duration = Math.round(performance.now() - start);
        if (duration < 2000) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-xs";
      showStatus("Testing latency for all nodes...", "loading");

      let best = 9999;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        parsedNodes[i].selected = (parsedNodes[i].ping !== null && parsedNodes[i].ping < 450);
        renderNodes();
      }

      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-stopwatch text-xs";
      showStatus("Benchmark Complete!", "success");
    }

    async function saveFastSubToGithub() {
      const token = document.getElementById("tokenInput").value.trim();
      const selectedUris = parsedNodes.filter(n => n.selected).map(n => n.uri);

      if (!token) {
        showStatus("GitHub Token (PAT) အရင် ထည့်ပေးပါ", "error");
        return;
      }

      if (selectedUris.length === 0) {
        showStatus("Node အနည်းဆုံး ၁ ခု ရွေးချယ်ပေးပါ", "error");
        return;
      }

      const saveBtn = document.getElementById("saveFastBtn");
      const saveIcon = document.getElementById("saveFastIcon");
      const saveText = document.getElementById("saveFastText");

      saveBtn.disabled = true;
      saveIcon.className = "fa-solid fa-spinner fa-spin text-xs";
      saveText.innerText = "Saving...";
      showStatus("fast-sub.txt သို့ GitHub ပေါ် သိမ်းဆည်းနေပါသည်...", "loading");

      try {
        const base64Content = btoa(selectedUris.join('\n'));
        let sha = null;
        try {
          const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`
            }
          });
          if (fileRes.ok) {
            const fileData = await fileRes.json();
            sha = fileData.sha;
          }
        } catch (e) {}

        const putPayload = {
          message: `Update fast-sub.txt (${selectedUris.length} nodes)`,
          content: base64Content,
          branch: "main"
        };
        if (sha) putPayload.sha = sha;

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putPayload)
        });

        if (updateRes.ok) {
          showStatus(`fast-sub.txt သို့ Node ${selectedUris.length} ခု သိမ်းဆည်းပြီးပါပြီ!`, "success");
          document.getElementById("fastSubUrl").value = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/fast-sub.txt?t=${Date.now()}`;
        } else {
          const err = await updateRes.json();
          showStatus(`Error: ${err.message}`, "error");
        }
      } catch (err) {
        showStatus("Network Error ဖြစ်ပေါ်နေပါသည်", "error");
      } finally {
        saveBtn.disabled = false;
        saveIcon.className = "fa-solid fa-cloud-arrow-up text-xs";
        saveText.innerText = "Save fast-sub.txt";
      }
    }

    function copyLink(inputId, btnId) {
      const input = document.getElementById(inputId);
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById(btnId);
      btn.innerText = "Copied";
      setTimeout(() => btn.innerText = "Copy", 2000);
      showStatus("Link copied!", "success");
    }

    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`Node "${node.name}" key copied!`, "success");
    }

    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("PAT Token required!", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-xs";
      showStatus("GitHub Actions သို့ အချက်ပြနေပါသည်...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Workflow dispatched! Refreshing pool in 15s...", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger failed.", "error");
        }
      } catch (err) {
        showStatus("Network Error.", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-arrows-rotate text-xs";
      }
    }

    fetchAndParseNodes();
  </script>
</body>
</html>
