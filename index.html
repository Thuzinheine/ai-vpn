<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['SF Mono', 'JetBrains Mono', 'Menlo', 'monospace'],
          },
          colors: {
            island: {
              bg: '#000000',
              card: '#161618',
              cardSub: '#202024',
              border: 'rgba(255, 255, 255, 0.08)',
              hover: 'rgba(255, 255, 255, 0.04)',
              blue: '#0a84ff',
              green: '#30d158',
              orange: '#ff9f0a',
              text: '#ffffff',
              muted: '#8e8e93',
              dim: '#48484a'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #09090b;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6 selection:bg-island-blue/30 selection:text-white">

  <!-- Floating Compact Island Container -->
  <div class="w-full max-w-[680px] bg-island-card border border-island-border rounded-3xl p-5 sm:p-6 shadow-2xl space-y-4">

    <!-- Top Compact Header -->
    <div class="flex items-center justify-between pb-3 border-b border-island-border">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-island-cardSub border border-island-border flex items-center justify-center text-island-blue">
          <i class="fa-solid fa-shield-halved text-xs"></i>
        </div>
        <div>
          <h1 class="text-xs font-semibold text-white tracking-tight">AI-VPN Core Hub</h1>
          <p class="text-[11px] text-island-muted">Automated Node Aggregation & Benchmark</p>
        </div>
      </div>

      <!-- Quick Metrics Pills -->
      <div class="flex items-center gap-1.5 text-xs font-mono">
        <div class="bg-island-cardSub px-2.5 py-1 rounded-full border border-island-border flex items-center gap-1.5">
          <span class="text-island-muted text-[10px] font-sans">Pool</span>
          <span id="selectedCount" class="font-semibold text-island-blue">0</span>
          <span class="text-island-dim">/</span>
          <span id="nodeCount" class="text-island-muted">0</span>
        </div>
        <div class="bg-island-cardSub px-2.5 py-1 rounded-full border border-island-border flex items-center gap-1.5">
          <span class="text-island-muted text-[10px] font-sans">Ping</span>
          <span id="bestPing" class="font-semibold text-island-green">-- ms</span>
        </div>
      </div>
    </div>

    <!-- Segmented View Switcher (Dashboard / Nodes Pool) -->
    <div class="grid grid-cols-2 p-1 bg-island-cardSub border border-island-border rounded-xl text-xs font-medium">
      <button onclick="switchView('overview')" id="btnTabOverview" class="py-1.5 rounded-lg bg-island-card text-white shadow-sm transition">
        <i class="fa-solid fa-sliders text-[10px] mr-1.5"></i> Overview & Links
      </button>
      <button onclick="switchView('nodes')" id="btnTabNodes" class="py-1.5 rounded-lg text-island-muted hover:text-white transition">
        <i class="fa-solid fa-list-check text-[10px] mr-1.5"></i> Node Selection Pool
      </button>
    </div>

    <!-- VIEW 1: Overview, Sub Links & Controls -->
    <div id="viewOverview" class="space-y-3.5">
      
      <!-- Sub URLs Compact Box -->
      <div class="bg-island-cardSub/60 border border-island-border rounded-2xl p-3.5 space-y-2.5">
        
        <!-- sub.txt -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-island-muted font-medium flex items-center gap-1">
              <i class="fa-solid fa-globe text-[10px]"></i> Main Sub (50 Nodes Pool)
            </span>
            <span class="text-island-dim font-mono text-[10px]">sub.txt</span>
          </div>
          <div class="flex items-center gap-2 bg-island-card border border-island-border rounded-xl p-1.5">
            <input type="text" id="officialSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
              class="w-full bg-transparent border-0 px-2 text-[11px] text-island-muted font-mono truncate select-all focus:outline-none">
            <button onclick="copyLink('officialSubUrl', 'copyOfficialBtn')" class="bg-white/5 hover:bg-white/10 text-white px-2.5 py-1 rounded-lg text-[11px] font-medium transition active:scale-95 flex items-center gap-1 flex-shrink-0">
              <i class="fa-regular fa-copy text-[10px]"></i>
              <span id="copyOfficialBtn">Copy</span>
            </button>
          </div>
        </div>

        <!-- fast-sub.txt -->
        <div class="space-y-1">
          <div class="flex justify-between items-center text-[11px]">
            <span class="text-island-blue font-medium flex items-center gap-1">
              <i class="fa-solid fa-bolt text-[10px]"></i> Fast Sub (Custom Benchmarked)
            </span>
            <span class="text-island-blue/60 font-mono text-[10px]">fast-sub.txt</span>
          </div>
          <div class="flex items-center gap-2 bg-island-card border border-island-border rounded-xl p-1.5">
            <input type="text" id="fastSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/fast-sub.txt"
              class="w-full bg-transparent border-0 px-2 text-[11px] text-island-blue font-mono truncate select-all focus:outline-none">
            <button onclick="copyLink('fastSubUrl', 'copyFastBtn')" class="bg-island-blue/15 hover:bg-island-blue/25 text-island-blue px-2.5 py-1 rounded-lg text-[11px] font-medium transition active:scale-95 flex items-center gap-1 flex-shrink-0">
              <i class="fa-regular fa-copy text-[10px]"></i>
              <span id="copyFastBtn">Copy</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Token Input -->
      <div class="space-y-1">
        <label class="text-[11px] text-island-muted font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-key text-[10px]"></i> GitHub Token (PAT)
        </label>
        <div class="relative">
          <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
            class="w-full bg-island-cardSub border border-island-border rounded-xl pl-3 pr-8 py-2 text-xs text-white placeholder-island-dim focus:outline-none focus:border-island-blue font-mono transition">
          <button type="button" onclick="toggleTokenVisibility()" class="absolute right-2.5 top-2.5 text-island-dim hover:text-white">
            <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Action Buttons Grid -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="triggerGithubUpdate()" id="updateBtn"
          class="bg-island-cardSub hover:bg-white/10 border border-island-border text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition">
          <i id="btnIcon" class="fa-solid fa-rotate text-[11px]"></i>
          <span>Scrape Actions</span>
        </button>

        <button onclick="runBenchmarkAll()" id="benchmarkBtn"
          class="bg-island-blue hover:bg-island-blue/90 text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition shadow-sm">
          <i id="testIcon" class="fa-solid fa-stopwatch text-[11px]"></i>
          <span>Test Latency</span>
        </button>
      </div>

      <!-- Save to fast-sub.txt -->
      <button onclick="saveFastSubToGithub()" id="saveFastBtn"
        class="w-full bg-island-cardSub hover:bg-white/10 border border-island-border text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition">
        <i id="saveFastIcon" class="fa-solid fa-cloud-arrow-up text-island-blue text-[11px]"></i>
        <span id="saveFastText">Save Selected to fast-sub.txt</span>
      </button>

      <!-- Status Toast Message -->
      <div id="statusBox" class="hidden p-2.5 rounded-xl text-xs flex items-center gap-2 border">
        <i id="statusIcon" class="fa-solid fa-info text-[10px]"></i>
        <span id="statusMessage" class="truncate font-medium text-[11px]"></span>
      </div>

      <!-- External Key Input -->
      <div class="pt-2 border-t border-island-border space-y-1">
        <label class="text-[11px] text-island-muted font-medium">Add External VLESS Key</label>
        <div class="flex gap-2">
          <input type="text" id="customNodeInput" placeholder="vless://..."
            class="w-full bg-island-cardSub border border-island-border rounded-xl px-2.5 py-1.5 text-xs text-white placeholder-island-dim focus:outline-none focus:border-island-blue font-mono transition">
          <button onclick="addCustomNode()" class="bg-island-cardSub hover:bg-white/10 border border-island-border text-white px-3 py-1.5 rounded-xl text-xs font-medium active:scale-95 transition">
            Add
          </button>
        </div>
      </div>

    </div>

    <!-- VIEW 2: Node Selection List (Clean Compact List) -->
    <div id="viewNodes" class="hidden space-y-3">
      
      <!-- List Toolbar -->
      <div class="flex items-center justify-between pb-2 border-b border-island-border">
        <span class="text-xs font-medium text-white">Active Nodes</span>

        <div class="flex items-center gap-1 bg-island-cardSub p-1 rounded-lg border border-island-border text-[10px]">
          <button onclick="selectPreset('all')" class="hover:bg-white/10 text-white px-2 py-0.5 rounded transition">All</button>
          <button onclick="selectPreset('good')" class="hover:bg-white/10 text-island-blue px-2 py-0.5 rounded transition">&lt; 350ms</button>
          <button onclick="selectPreset('none')" class="hover:bg-white/10 text-island-muted px-2 py-0.5 rounded transition">Clear</button>
          <button onclick="fetchAndParseNodes()" title="Reload from GitHub" class="text-island-muted hover:text-white px-1.5 py-0.5 rounded transition">
            <i class="fa-solid fa-arrow-rotate-right text-[10px]"></i>
          </button>
        </div>
      </div>

      <!-- Nodes Scrollable Area -->
      <div id="nodeListContainer" class="space-y-1.5 max-h-[380px] overflow-y-auto pr-1 custom-scroll">
        <div class="text-center py-20 text-xs text-island-dim">
          <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Loading active nodes...
        </div>
      </div>

    </div>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function switchView(tab) {
      const viewOverview = document.getElementById("viewOverview");
      const viewNodes = document.getElementById("viewNodes");
      const btnTabOverview = document.getElementById("btnTabOverview");
      const btnTabNodes = document.getElementById("btnTabNodes");

      if (tab === 'overview') {
        viewOverview.classList.remove("hidden");
        viewNodes.classList.add("hidden");
        btnTabOverview.className = "py-1.5 rounded-lg bg-island-card text-white shadow-sm transition";
        btnTabNodes.className = "py-1.5 rounded-lg text-island-muted hover:text-white transition";
      } else {
        viewOverview.classList.add("hidden");
        viewNodes.classList.remove("hidden");
        btnTabNodes.className = "py-1.5 rounded-lg bg-island-card text-white shadow-sm transition";
        btnTabOverview.className = "py-1.5 rounded-lg text-island-muted hover:text-white transition";
      }
    }

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-2.5 rounded-xl text-xs flex items-center gap-2 border ";
      if (type === "success") {
        box.classList.add("bg-island-cardSub", "border-island-green/30", "text-island-green");
        icon.className = "fa-solid fa-check text-[10px] text-island-green";
      } else if (type === "error") {
        box.classList.add("bg-island-cardSub", "border-rose-500/30", "text-rose-400");
        icon.className = "fa-solid fa-circle-exclamation text-[10px] text-rose-400";
      } else {
        box.classList.add("bg-island-cardSub", "border-island-border", "text-island-muted");
        icon.className = "fa-solid fa-circle-notch fa-spin text-[10px] text-island-blue";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="text-center py-20 text-xs text-island-dim"><i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Loading sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { id: idx, uri, name, host, ping: null, speed: null, selected: true };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="text-center py-20 text-xs text-rose-400">Failed to load sub.txt</div>`;
      }
    }

    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="text-center py-20 text-xs text-island-dim">No nodes available.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-island-cardSub border ${n.selected ? 'border-island-blue/40' : 'border-island-border'} hover:border-white/20 px-3 py-2 rounded-xl flex items-center justify-between gap-2.5 transition">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <input type="checkbox" ${n.selected ? 'checked' : ''} onchange="toggleSelect(${i})"
              class="w-3.5 h-3.5 rounded bg-island-card border-island-border text-island-blue focus:ring-0 cursor-pointer accent-island-blue">
            
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${n.ping ? (n.ping < 250 ? 'bg-island-green' : 'bg-island-orange') : 'bg-island-dim'}"></span>
                <h3 class="text-xs font-medium ${n.selected ? 'text-white' : 'text-island-muted'} truncate">${n.name}</h3>
              </div>
              <p class="text-[10px] text-island-dim font-mono mt-0.5 truncate pl-3">${n.host}</p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <div class="text-right font-mono">
              <div class="text-[11px] font-medium ${n.ping ? (n.ping < 250 ? 'text-island-green' : 'text-island-orange') : 'text-island-dim'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[9px] text-island-dim">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode(${i})" title="Copy key" class="bg-white/5 hover:bg-white/15 text-island-muted hover:text-white p-1 rounded-lg text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy text-[10px]"></i>
            </button>
          </div>
        </div>
      `).join('');

      updateSelectionCount();
    }

    function toggleSelect(index) {
      parsedNodes[index].selected = !parsedNodes[index].selected;
      renderNodes();
    }

    function selectPreset(type) {
      if (type === 'all') {
        parsedNodes.forEach(n => n.selected = true);
      } else if (type === 'none') {
        parsedNodes.forEach(n => n.selected = false);
      } else if (type === 'good') {
        parsedNodes.forEach(n => {
          n.selected = (n.ping !== null && n.ping < 350);
        });
      }
      renderNodes();
    }

    function updateSelectionCount() {
      const selected = parsedNodes.filter(n => n.selected).length;
      document.getElementById("selectedCount").innerText = selected;
    }

    function addCustomNode() {
      const input = document.getElementById("customNodeInput");
      const val = input.value.trim();

      if (!val || !val.startsWith("vless://")) {
        showStatus("Invalid vless:// key", "error");
        return;
      }

      let name = `Custom-${parsedNodes.length + 1}`;
      let host = "custom.edge";
      try {
        if (val.includes('#')) name = decodeURIComponent(val.split('#')[1]);
        const matchHost = val.match(/sni=([^&]+)/) || val.match(/host=([^&]+)/) || val.match(/@([^:]+)/);
        if (matchHost) host = matchHost[1];
      } catch(e) {}

      parsedNodes.unshift({
        id: Date.now(),
        uri: val,
        name: name,
        host: host,
        ping: null,
        speed: null,
        selected: true
      });

      input.value = "";
      document.getElementById("nodeCount").innerText = parsedNodes.length;
      renderNodes();
      showStatus(`Added "${name}"`, "success");
    }

    async function testSingleNode(node) {
      const start = performance.now();
      try {
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        const duration = Math.round(performance.now() - start);
        if (duration < 2000) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Benchmarking latency...", "loading");

      let best = 9999;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        parsedNodes[i].selected = (parsedNodes[i].ping !== null && parsedNodes[i].ping < 450);
        renderNodes();
      }

      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-stopwatch text-[11px]";
      showStatus("Benchmark Complete", "success");
    }

    async function saveFastSubToGithub() {
      const token = document.getElementById("tokenInput").value.trim();
      const selectedUris = parsedNodes.filter(n => n.selected).map(n => n.uri);

      if (!token) {
        showStatus("GitHub PAT required", "error");
        return;
      }

      if (selectedUris.length === 0) {
        showStatus("Select at least 1 node", "error");
        return;
      }

      const saveBtn = document.getElementById("saveFastBtn");
      const saveIcon = document.getElementById("saveFastIcon");
      const saveText = document.getElementById("saveFastText");

      saveBtn.disabled = true;
      saveIcon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      saveText.innerText = "Saving...";
      showStatus("Saving to fast-sub.txt...", "loading");

      try {
        const base64Content = btoa(selectedUris.join('\n'));
        let sha = null;
        try {
          const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`
            }
          });
          if (fileRes.ok) {
            const fileData = await fileRes.json();
            sha = fileData.sha;
          }
        } catch (e) {}

        const putPayload = {
          message: `Update fast-sub.txt (${selectedUris.length} nodes)`,
          content: base64Content,
          branch: "main"
        };
        if (sha) putPayload.sha = sha;

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putPayload)
        });

        if (updateRes.ok) {
          showStatus(`Saved ${selectedUris.length} nodes to fast-sub.txt`, "success");
          document.getElementById("fastSubUrl").value = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/fast-sub.txt?t=${Date.now()}`;
        } else {
          const err = await updateRes.json();
          showStatus(`Error: ${err.message}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error", "error");
      } finally {
        saveBtn.disabled = false;
        saveIcon.className = "fa-solid fa-cloud-arrow-up text-[11px] text-island-blue";
        saveText.innerText = "Save Selected to fast-sub.txt";
      }
    }

    function copyLink(inputId, btnId) {
      const input = document.getElementById(inputId);
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById(btnId);
      btn.innerText = "Copied";
      setTimeout(() => btn.innerText = "Copy", 2000);
      showStatus("Link copied", "success");
    }

    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`Copied "${node.name}"`, "success");
    }

    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("PAT Token required", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-[11px]";
      showStatus("Dispatching Action...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Action dispatched! Refreshing in 15s...", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger failed", "error");
        }
      } catch (err) {
        showStatus("Network Error", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-rotate text-[11px]";
      }
    }

    fetchAndParseNodes();
  </script>
</body>
</html>
