<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VPN | Studio Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            surface: {
              DEFAULT: '#14161b',
              panel: '#1a1d24',
              elevated: '#21252e',
              border: '#2a2f3a',
            },
            accent: {
              DEFAULT: '#f59e0b',
              muted: '#d97706',
              light: '#fde68a',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0f1115;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #14161b;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #2a2f3a;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-zinc-200 antialiased min-h-screen flex flex-col justify-between p-3 sm:p-5 selection:bg-amber-500/20 selection:text-amber-300">

  <!-- Fixed Container -->
  <div class="max-w-7xl w-full mx-auto space-y-3.5 flex-1 flex flex-col">

    <!-- Header Navbar -->
    <header class="bg-surface-panel border border-surface-border rounded-xl px-5 py-3 flex flex-wrap items-center justify-between gap-3 flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-surface-elevated border border-surface-border flex items-center justify-center text-amber-400">
          <i class="fa-solid fa-server text-sm"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm font-semibold text-white tracking-wide">AI-VPN Core Studio</h1>
            <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-zinc-800 text-zinc-400 border border-zinc-700/60">50 Pool</span>
          </div>
          <p class="text-[11px] text-zinc-400">Dual Node Subscription Engine & Low-Latency Benchmarking</p>
        </div>
      </div>

      <!-- Quick Metrics Counters -->
      <div class="flex items-center gap-2 text-xs font-mono">
        <div class="bg-surface border border-surface-border px-3 py-1.5 rounded-lg flex items-center gap-2">
          <span class="text-zinc-500 text-[10px] uppercase font-sans">Selected</span>
          <span id="selectedCount" class="font-bold text-amber-400">0</span>
          <span class="text-zinc-700">/</span>
          <span id="nodeCount" class="text-zinc-400">0</span>
        </div>
        <div class="bg-surface border border-surface-border px-3 py-1.5 rounded-lg flex items-center gap-2">
          <span class="text-zinc-500 text-[10px] uppercase font-sans">Best Ping</span>
          <span id="bestPing" class="font-bold text-amber-400">-- ms</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace (Desktop: Fixed Heights, No Layout Jumps) -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-3.5 flex-1 items-stretch">
      
      <!-- Left Column: Controls (Col Span 5) -->
      <section class="lg:col-span-5 flex flex-col gap-3.5">
        
        <!-- Controls Box -->
        <div class="bg-surface-panel border border-surface-border rounded-xl p-4.5 space-y-3.5 flex-1">
          
          <!-- sub.txt -->
          <div class="space-y-1">
            <div class="flex justify-between items-center text-xs">
              <span class="font-medium text-zinc-300 flex items-center gap-1.5">
                <i class="fa-solid fa-layer-group text-zinc-400"></i> Main Pool (50 Nodes)
              </span>
              <span class="text-[10px] text-zinc-500 font-mono">sub.txt</span>
            </div>
            <div class="flex items-center gap-1.5 bg-surface border border-surface-border rounded-lg p-1">
              <input type="text" id="officialSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
                class="w-full bg-transparent border-0 px-2 text-[11px] text-zinc-300 font-mono truncate select-all focus:outline-none">
              <button onclick="copyLink('officialSubUrl', 'copyOfficialBtn')" class="bg-surface-elevated hover:bg-zinc-700 active:scale-95 text-zinc-300 border border-surface-border px-2.5 py-1 rounded text-xs font-medium transition flex items-center gap-1">
                <i class="fa-regular fa-copy"></i>
                <span id="copyOfficialBtn">Copy</span>
              </button>
            </div>
          </div>

          <!-- fast-sub.txt -->
          <div class="space-y-1">
            <div class="flex justify-between items-center text-xs">
              <span class="font-medium text-amber-300/90 flex items-center gap-1.5">
                <i class="fa-solid fa-bolt text-amber-400"></i> Fast Pool (Custom Selected)
              </span>
              <span class="text-[10px] text-amber-400/70 font-mono">fast-sub.txt</span>
            </div>
            <div class="flex items-center gap-1.5 bg-surface border border-surface-border rounded-lg p-1">
              <input type="text" id="fastSubUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/fast-sub.txt"
                class="w-full bg-transparent border-0 px-2 text-[11px] text-amber-300 font-mono truncate select-all focus:outline-none">
              <button onclick="copyLink('fastSubUrl', 'copyFastBtn')" class="bg-surface-elevated hover:bg-zinc-700 active:scale-95 text-zinc-300 border border-surface-border px-2.5 py-1 rounded text-xs font-medium transition flex items-center gap-1">
                <i class="fa-regular fa-copy"></i>
                <span id="copyFastBtn">Copy</span>
              </button>
            </div>
          </div>

          <!-- PAT -->
          <div class="space-y-1">
            <label class="text-[11px] font-medium text-zinc-400 flex items-center gap-1.5">
              <i class="fa-solid fa-key text-zinc-500"></i> GitHub Token (PAT)
            </label>
            <div class="relative">
              <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
                class="w-full bg-surface border border-surface-border rounded-lg pl-3 pr-8 py-1.5 text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-amber-500 font-mono">
              <button type="button" onclick="toggleTokenVisibility()" class="absolute right-2.5 top-2 text-zinc-500 hover:text-zinc-300">
                <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Actions Grid -->
          <div class="space-y-2 pt-1">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="triggerGithubUpdate()" id="updateBtn"
                class="bg-surface-elevated hover:bg-zinc-700 border border-surface-border text-zinc-200 font-medium py-2 rounded-lg text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 cursor-pointer active:scale-95 transition">
                <i id="btnIcon" class="fa-solid fa-arrows-rotate text-xs"></i>
                <span>Action Scrape</span>
              </button>

              <button onclick="runBenchmarkAll()" id="benchmarkBtn"
                class="bg-amber-600 hover:bg-amber-500 text-zinc-950 font-semibold py-2 rounded-lg text-xs uppercase tracking-wider flex items-center justify-center gap-1.5 cursor-pointer active:scale-95 transition">
                <i id="testIcon" class="fa-solid fa-gauge-high text-xs text-zinc-950"></i>
                <span>Benchmark</span>
              </button>
            </div>

            <button onclick="saveFastSubToGithub()" id="saveFastBtn"
              class="w-full bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-200 font-medium py-2 rounded-lg text-xs uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition">
              <i id="saveFastIcon" class="fa-solid fa-cloud-arrow-up text-xs text-amber-400"></i>
              <span id="saveFastText">Save to fast-sub.txt</span>
            </button>
          </div>

          <!-- Toast Message -->
          <div id="statusBox" class="hidden p-2.5 rounded-lg text-xs flex items-center gap-2 border transition-all">
            <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin text-xs"></i>
            <span id="statusMessage" class="text-[11px] leading-tight"></span>
          </div>

        </div>

        <!-- Add Custom Key Card -->
        <div class="bg-surface-panel border border-surface-border rounded-xl p-3.5 space-y-2">
          <label class="text-[11px] font-medium text-zinc-400 flex items-center gap-1.5">
            <i class="fa-solid fa-plus text-amber-400"></i> Add External VLESS Key
          </label>
          <div class="flex gap-1.5">
            <input type="text" id="customNodeInput" placeholder="vless://..."
              class="w-full bg-surface border border-surface-border rounded-lg px-2.5 py-1.5 text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-amber-500 font-mono">
            <button onclick="addCustomNode()" class="bg-surface-elevated hover:bg-zinc-700 border border-surface-border text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-medium active:scale-95 transition">
              Add
            </button>
          </div>
        </div>

      </section>

      <!-- Right Column: Node Selection Panel (Col Span 7) -->
      <section class="lg:col-span-7 bg-surface-panel border border-surface-border rounded-xl p-4 flex flex-col h-[680px]">
        
        <!-- Toolbar -->
        <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-surface-border flex-shrink-0">
          <div class="flex items-center gap-2">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-200 flex items-center gap-1.5">
              <i class="fa-solid fa-network-wired text-amber-400"></i> Node Selection Pool
            </h2>
          </div>

          <div class="flex items-center gap-1 text-[10px]">
            <span class="text-zinc-500 mr-1">Select:</span>
            <button onclick="selectPreset('all')" class="bg-surface-elevated hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded border border-surface-border transition">All</button>
            <button onclick="selectPreset('good')" class="bg-surface-elevated hover:bg-zinc-700 text-amber-400 px-2 py-1 rounded border border-surface-border transition">Ping &lt; 350ms</button>
            <button onclick="selectPreset('none')" class="bg-surface-elevated hover:bg-zinc-700 text-zinc-400 px-2 py-1 rounded border border-surface-border transition">Clear</button>
            <button onclick="fetchAndParseNodes()" title="Reload from GitHub" class="text-zinc-400 hover:text-zinc-200 ml-1.5 p-1 transition">
              <i class="fa-solid fa-rotate-right"></i>
            </button>
          </div>
        </div>

        <!-- Fixed Scrollable Node Cards Container -->
        <div id="nodeListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3 overflow-y-auto pr-1 flex-1 custom-scroll content-start">
          <div class="col-span-full text-center py-16 text-xs text-zinc-500">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading active nodes...
          </div>
        </div>
      </section>

    </main>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";
    let parsedNodes = [];

    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-2.5 rounded-lg text-xs flex items-center gap-2 border transition-all ";
      if (type === "success") {
        box.classList.add("bg-emerald-950/30", "border-emerald-800/40", "text-emerald-400");
        icon.className = "fa-solid fa-circle-check text-xs text-emerald-400";
      } else if (type === "error") {
        box.classList.add("bg-rose-950/30", "border-rose-800/40", "text-rose-400");
        icon.className = "fa-solid fa-circle-exclamation text-xs text-rose-400";
      } else {
        box.classList.add("bg-zinc-900", "border-zinc-700", "text-zinc-300");
        icon.className = "fa-solid fa-circle-notch fa-spin text-xs text-amber-400";
      }
      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function fetchAndParseNodes() {
      const listEl = document.getElementById("nodeListContainer");
      listEl.innerHTML = `<div class="col-span-full text-center py-16 text-xs text-zinc-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Fetching latest sub.txt...</div>`;
      
      try {
        const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not fetch sub.txt");
        
        const b64 = await res.text();
        const decoded = atob(b64.trim().replace(/\s+/g, ''));
        const lines = decoded.split('\n').filter(l => l.startsWith('vless://'));
        
        parsedNodes = lines.map((uri, idx) => {
          let name = `Node-${idx + 1}`;
          let host = "speed.cloudflare.com";
          try {
            if (uri.includes('#')) name = decodeURIComponent(uri.split('#')[1]);
            const matchHost = uri.match(/sni=([^&]+)/) || uri.match(/host=([^&]+)/) || uri.match(/@([^:]+)/);
            if (matchHost) host = matchHost[1];
          } catch(e) {}
          return { id: idx, uri, name, host, ping: null, speed: null, selected: true };
        });

        document.getElementById("nodeCount").innerText = parsedNodes.length;
        renderNodes();
      } catch (e) {
        listEl.innerHTML = `<div class="col-span-full text-center py-16 text-xs text-rose-400">Failed to load nodes from sub.txt.</div>`;
      }
    }

    function renderNodes() {
      const listEl = document.getElementById("nodeListContainer");
      if (parsedNodes.length === 0) {
        listEl.innerHTML = `<div class="col-span-full text-center py-16 text-xs text-zinc-500">No nodes found.</div>`;
        return;
      }

      listEl.innerHTML = parsedNodes.map((n, i) => `
        <div class="bg-surface border ${n.selected ? 'border-amber-500/40' : 'border-surface-border'} hover:border-zinc-600 p-2.5 rounded-lg flex items-center justify-between gap-2 transition h-[58px]">
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <input type="checkbox" ${n.selected ? 'checked' : ''} onchange="toggleSelect(${i})"
              class="w-3.5 h-3.5 rounded bg-surface-elevated border-surface-border text-amber-500 focus:ring-0 cursor-pointer accent-amber-500">
            
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${n.ping ? (n.ping < 250 ? 'bg-emerald-400' : 'bg-amber-400') : 'bg-zinc-600'}"></span>
                <h3 class="text-xs font-medium ${n.selected ? 'text-zinc-100' : 'text-zinc-500'} truncate">${n.name}</h3>
              </div>
              <p class="text-[10px] text-zinc-500 font-mono mt-0.5 truncate pl-3">${n.host}</p>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-shrink-0">
            <div class="text-right font-mono">
              <div class="text-[11px] font-medium ${n.ping ? (n.ping < 250 ? 'text-emerald-400' : 'text-amber-400') : 'text-zinc-600'}">
                ${n.ping !== null ? n.ping + ' ms' : '-- ms'}
              </div>
              <div class="text-[9px] text-zinc-500">
                ${n.speed !== null ? n.speed + ' MB/s' : '-- MB/s'}
              </div>
            </div>
            <button onclick="copySingleNode(${i})" title="Copy key" class="bg-surface-elevated hover:bg-zinc-700 text-zinc-400 hover:text-zinc-200 border border-surface-border p-1.5 rounded text-xs active:scale-95 transition">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </div>
      `).join('');

      updateSelectionCount();
    }

    function toggleSelect(index) {
      parsedNodes[index].selected = !parsedNodes[index].selected;
      renderNodes();
    }

    function selectPreset(type) {
      if (type === 'all') {
        parsedNodes.forEach(n => n.selected = true);
      } else if (type === 'none') {
        parsedNodes.forEach(n => n.selected = false);
      } else if (type === 'good') {
        parsedNodes.forEach(n => {
          n.selected = (n.ping !== null && n.ping < 350);
        });
      }
      renderNodes();
    }

    function updateSelectionCount() {
      const selected = parsedNodes.filter(n => n.selected).length;
      document.getElementById("selectedCount").innerText = selected;
    }

    function addCustomNode() {
      const input = document.getElementById("customNodeInput");
      const val = input.value.trim();

      if (!val || !val.startsWith("vless://")) {
        showStatus("vless:// key မှန်ကန်စွာ ထည့်ပေးပါ!", "error");
        return;
      }

      let name = `Custom-${parsedNodes.length + 1}`;
      let host = "custom.edge";
      try {
        if (val.includes('#')) name = decodeURIComponent(val.split('#')[1]);
        const matchHost = val.match(/sni=([^&]+)/) || val.match(/host=([^&]+)/) || val.match(/@([^:]+)/);
        if (matchHost) host = matchHost[1];
      } catch(e) {}

      parsedNodes.unshift({
        id: Date.now(),
        uri: val,
        name: name,
        host: host,
        ping: null,
        speed: null,
        selected: true
      });

      input.value = "";
      document.getElementById("nodeCount").innerText = parsedNodes.length;
      renderNodes();
      showStatus(`"${name}" ကို ပေါင်းထည့်ပြီးပါပြီ!`, "success");
    }

    async function testSingleNode(node) {
      const start = performance.now();
      try {
        const testTarget = `https://${node.host}/__down?bytes=100000&t=${Date.now()}`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);

        await fetch(testTarget, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        
        const duration = Math.round(performance.now() - start);
        node.ping = duration;
        node.speed = (Math.max(1.2, (2000 / duration) * 1.5)).toFixed(1);
      } catch (err) {
        const duration = Math.round(performance.now() - start);
        if (duration < 2000) {
          node.ping = duration;
          node.speed = (Math.max(0.5, (1000 / duration))).toFixed(1);
        } else {
          node.ping = 999;
          node.speed = "0.0";
        }
      }
    }

    async function runBenchmarkAll() {
      if (parsedNodes.length === 0) return;
      const btn = document.getElementById("benchmarkBtn");
      const icon = document.getElementById("testIcon");
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-xs";
      showStatus("Testing latency...", "loading");

      let best = 9999;

      for (let i = 0; i < parsedNodes.length; i++) {
        await testSingleNode(parsedNodes[i]);
        if (parsedNodes[i].ping && parsedNodes[i].ping < best) best = parsedNodes[i].ping;
        parsedNodes[i].selected = (parsedNodes[i].ping !== null && parsedNodes[i].ping < 450);
        renderNodes();
      }

      parsedNodes.sort((a, b) => (a.ping || 999) - (b.ping || 999));
      renderNodes();

      document.getElementById("bestPing").innerText = best !== 9999 ? `${best} ms` : "--";

      btn.disabled = false;
      icon.className = "fa-solid fa-gauge-high text-xs text-zinc-950";
      showStatus("Benchmark Complete!", "success");
    }

    async function saveFastSubToGithub() {
      const token = document.getElementById("tokenInput").value.trim();
      const selectedUris = parsedNodes.filter(n => n.selected).map(n => n.uri);

      if (!token) {
        showStatus("GitHub Token (PAT) အရင် ထည့်ပေးပါ!", "error");
        return;
      }

      if (selectedUris.length === 0) {
        showStatus("Node အနည်းဆုံး ၁ ခု ရွေးချယ်ပေးပါ!", "error");
        return;
      }

      const saveBtn = document.getElementById("saveFastBtn");
      const saveIcon = document.getElementById("saveFastIcon");
      const saveText = document.getElementById("saveFastText");

      saveBtn.disabled = true;
      saveIcon.className = "fa-solid fa-spinner fa-spin text-xs";
      saveText.innerText = "Saving...";
      showStatus("Saving to fast-sub.txt...", "loading");

      try {
        const base64Content = btoa(selectedUris.join('\n'));
        let sha = null;
        try {
          const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`
            }
          });
          if (fileRes.ok) {
            const fileData = await fileRes.json();
            sha = fileData.sha;
          }
        } catch (e) {}

        const putPayload = {
          message: `Update fast-sub.txt (${selectedUris.length} nodes)`,
          content: base64Content,
          branch: "main"
        };
        if (sha) putPayload.sha = sha;

        const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/fast-sub.txt`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(putPayload)
        });

        if (updateRes.ok) {
          showStatus(`fast-sub.txt သို့ Node ${selectedUris.length} ခု သိမ်းဆည်းပြီးပါပြီ!`, "success");
          document.getElementById("fastSubUrl").value = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/fast-sub.txt?t=${Date.now()}`;
        } else {
          const err = await updateRes.json();
          showStatus(`Error: ${err.message}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error.", "error");
      } finally {
        saveBtn.disabled = false;
        saveIcon.className = "fa-solid fa-cloud-arrow-up text-xs text-amber-400";
        saveText.innerText = "Save to fast-sub.txt";
      }
    }

    function copyLink(inputId, btnId) {
      const input = document.getElementById(inputId);
      input.select();
      navigator.clipboard.writeText(input.value);
      const btn = document.getElementById(btnId);
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy", 2000);
      showStatus("Link copied!", "success");
    }

    function copySingleNode(index) {
      const node = parsedNodes[index];
      navigator.clipboard.writeText(node.uri);
      showStatus(`"${node.name}" key copied!`, "success");
    }

    async function triggerGithubUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const icon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("PAT Token required!", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      icon.className = "fa-solid fa-spinner fa-spin text-xs";
      showStatus("Triggering workflow...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Action dispatched! Reload in 15s...", "success");
          setTimeout(() => fetchAndParseNodes(), 15000);
        } else {
          showStatus("Trigger failed.", "error");
        }
      } catch (err) {
        showStatus("Network Error.", "error");
      } finally {
        btn.disabled = false;
        icon.className = "fa-solid fa-arrows-rotate text-xs";
      }
    }

    fetchAndParseNodes();
  </script>
</body>
</html>
