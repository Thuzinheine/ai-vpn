<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI VPN | Edge Gateway Core</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            },
            mint: {
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              neon: '#00ff9d',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #060b09;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 255, 157, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(5, 150, 105, 0.04) 0%, transparent 60%);
    }

    .neon-card {
      background: rgba(10, 18, 14, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(52, 211, 153, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px -15px rgba(0, 255, 157, 0.12);
    }

    .neon-glow-btn {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .neon-glow-btn:hover {
      box-shadow: 0 0 35px rgba(0, 255, 157, 0.55);
      transform: translateY(-1px);
    }
    .neon-glow-btn:active {
      transform: translateY(1px);
    }

    .grid-lines {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(52, 211, 153, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(52, 211, 153, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-mint-neon selection:text-black grid-lines">

  <div class="w-full max-w-lg space-y-4 relative">
    
    <!-- Ambient Green Glow Behind Card -->
    <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-72 h-72 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <!-- Main Container -->
    <div class="neon-card rounded-3xl p-6 sm:p-8 space-y-6">
      
      <!-- Top Brand Header -->
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 via-mint-neon to-emerald-600 p-[1px] shadow-lg shadow-emerald-500/20">
            <div class="w-full h-full bg-[#08120d] rounded-2xl flex items-center justify-center">
              <i class="fa-solid fa-bolt-lightning text-mint-neon text-xl drop-shadow-[0_0_8px_rgba(0,255,157,0.8)]"></i>
            </div>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-bold tracking-tight text-white font-sans">AI-VPN Core</h1>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wide uppercase bg-emerald-500/15 text-mint-neon border border-emerald-500/30">
                v2.5
              </span>
            </div>
            <p class="text-xs text-emerald-100/60 mt-0.5">Automated High-Performance VLESS Hub</p>
          </div>
        </div>

        <!-- Live Pulse Node Status -->
        <div class="flex items-center gap-2 bg-[#0c1a13] border border-emerald-500/25 px-3 py-1.5 rounded-full shadow-inner">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-mint-neon opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-mint-neon"></span>
          </span>
          <span class="text-[11px] font-semibold text-emerald-300">Live Pool</span>
        </div>
      </div>

      <!-- Quick Stats Pills (SG/JP Focus) -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-[#09150f]/80 p-3 rounded-2xl border border-emerald-500/15 flex flex-col items-center justify-center text-center">
          <span class="text-[10px] uppercase font-semibold tracking-wider text-emerald-300/60 mb-0.5">Route</span>
          <span class="text-xs font-bold text-mint-neon flex items-center gap-1">
            <i class="fa-solid fa-paper-plane text-[10px]"></i> SG / JP
          </span>
        </div>
        <div class="bg-[#09150f]/80 p-3 rounded-2xl border border-emerald-500/15 flex flex-col items-center justify-center text-center">
          <span class="text-[10px] uppercase font-semibold tracking-wider text-emerald-300/60 mb-0.5">Capacity</span>
          <span class="text-xs font-bold text-emerald-300 flex items-center gap-1">
            <i class="fa-solid fa-layer-group text-[10px]"></i> 50+ Nodes
          </span>
        </div>
        <div class="bg-[#09150f]/80 p-3 rounded-2xl border border-emerald-500/15 flex flex-col items-center justify-center text-center">
          <span class="text-[10px] uppercase font-semibold tracking-wider text-emerald-300/60 mb-0.5">Auto-Cron</span>
          <span class="text-xs font-bold text-emerald-400 flex items-center gap-1">
            <i class="fa-solid fa-arrows-spin text-[10px]"></i> Every 6H
          </span>
        </div>
      </div>

      <!-- Token Input Section -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs">
          <label class="text-emerald-200/90 font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i> GitHub Token (PAT)
          </label>
          <span class="text-[11px] text-emerald-200/40">Browser Memory Only</span>
        </div>
        
        <div class="relative">
          <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
            class="w-full bg-[#08130e] border border-emerald-500/25 rounded-2xl pl-4 pr-11 py-3 text-xs text-emerald-100 placeholder-emerald-900/60 focus:outline-none focus:border-mint-neon focus:ring-1 focus:ring-mint-neon transition-all font-mono">
          <button type="button" onclick="toggleTokenVisibility()" class="absolute right-3.5 top-3 text-emerald-500/60 hover:text-mint-neon transition">
            <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Action Button (Neon Mint) -->
      <button onclick="triggerUpdate()" id="updateBtn"
        class="w-full bg-gradient-to-r from-emerald-500 via-emerald-400 to-mint-neon text-slate-950 font-bold py-3.5 rounded-2xl neon-glow-btn flex items-center justify-center gap-2.5 cursor-pointer">
        <i id="btnIcon" class="fa-solid fa-arrows-rotate text-sm transition-transform duration-500"></i>
        <span id="btnText" class="tracking-wide text-xs uppercase font-extrabold">Refresh Subscription Now</span>
      </button>

      <!-- Dynamic Status Feedback -->
      <div id="statusBox" class="hidden p-3.5 rounded-2xl text-xs flex items-center gap-3 border transition-all duration-300">
        <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin text-sm"></i>
        <span id="statusMessage" class="leading-relaxed"></span>
      </div>

      <!-- Output Subscription Link Box -->
      <div class="space-y-2 pt-3 border-t border-emerald-500/15">
        <label class="text-xs text-emerald-200/90 font-medium flex items-center justify-between">
          <span class="flex items-center gap-1.5"><i class="fa-solid fa-link text-mint-neon"></i> Your Sub URL</span>
          <span class="text-[10px] text-emerald-400/60">Base64 Encoded</span>
        </label>
        
        <div class="flex items-center gap-2 bg-[#08130e] border border-emerald-500/25 rounded-2xl p-2 focus-within:border-emerald-400 transition">
          <input type="text" id="subUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
            class="w-full bg-transparent border-0 px-2.5 text-xs text-mint-neon font-mono tracking-tight select-all focus:outline-none truncate">
          <button onclick="copySubLink()" id="copyBtn" class="bg-emerald-500/15 hover:bg-emerald-500/25 active:scale-95 text-mint-neon border border-emerald-500/30 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
            <i id="copyIcon" class="fa-regular fa-copy"></i>
            <span id="copyText">Copy</span>
          </button>
        </div>
      </div>

    </div>

    <!-- Minimal Modern Footer -->
    <div class="text-center text-[11px] text-emerald-400/40 flex items-center justify-center gap-2 font-mono">
      <span>Auto-Merge Core</span>
      <span>•</span>
      <span>NekoBox & Sing-box Ready</span>
    </div>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";

    // Load saved PAT token
    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-3.5 rounded-2xl text-xs flex items-center gap-3 border transition-all duration-300 ";
      
      if (type === "success") {
        box.classList.add("bg-emerald-500/15", "border-emerald-500/40", "text-mint-neon");
        icon.className = "fa-solid fa-circle-check text-base text-mint-neon";
      } else if (type === "error") {
        box.classList.add("bg-rose-500/15", "border-rose-500/40", "text-rose-300");
        icon.className = "fa-solid fa-circle-exclamation text-base text-rose-400";
      } else {
        box.classList.add("bg-emerald-500/10", "border-emerald-500/30", "text-emerald-200");
        icon.className = "fa-solid fa-circle-notch fa-spin text-base text-mint-neon";
      }

      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function triggerUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const btnText = document.getElementById("btnText");
      const btnIcon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("GitHub Access Token (PAT) အရင် ထည့်ပေးပါခင်ဗျာ!", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      btn.classList.add("opacity-60", "cursor-not-allowed");
      btnIcon.classList.add("fa-spin");
      btnText.innerText = "Dispatching Action...";
      showStatus("GitHub Actions သို့ အချက်ပြနေပါသည်... စောင့်ဆိုင်းပေးပါ", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Scraping Engine စတင် run နေပါပြီ! ၁ မိနစ်အတွင်း Node ၅၀+ အသစ်များ စုစည်းပြီးစီးပါမည်။", "success");
          
          // Timestamp attached URL to prevent cache
          const freshSubUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
          document.getElementById("subUrl").value = freshSubUrl;
        } else {
          const errData = await response.json();
          showStatus(`Error: ${errData.message || "Trigger မအောင်မြင်ပါ"}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error ဖြစ်ပေါ်နေပါသည်။", "error");
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-60", "cursor-not-allowed");
        btnIcon.classList.remove("fa-spin");
        btnText.innerText = "Refresh Subscription Now";
      }
    }

    function copySubLink() {
      const input = document.getElementById("subUrl");
      input.select();
      navigator.clipboard.writeText(input.value);

      const copyText = document.getElementById("copyText");
      const copyIcon = document.getElementById("copyIcon");

      copyText.innerText = "Copied!";
      copyIcon.className = "fa-solid fa-check text-mint-neon";

      setTimeout(() => {
        copyText.innerText = "Copy";
        copyIcon.className = "fa-regular fa-copy";
      }, 2000);
    }
  </script>
</body>
</html>
