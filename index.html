<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-VPN Dashboard | Cloud Edge Nodes</title>
  <!-- Tailwind CSS & Font Awesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfeff',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-white">

  <div class="w-full max-w-lg space-y-5">
    
    <!-- Top Header -->
    <div class="glass-panel rounded-3xl p-6 shadow-2xl relative overflow-hidden">
      <div class="absolute -right-8 -top-8 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
      
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3.5">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
            <i class="fa-solid fa-shield-halved text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
              AI VPN Sub Hub
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                Active
              </span>
            </h1>
            <p class="text-xs text-slate-400">Singapore & Japan High-Speed VLESS Pool</p>
          </div>
        </div>

        <!-- Live Server Status Indicator -->
        <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/60 text-xs">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-slate-300 font-medium text-[11px]">Edge Auto-Sync</span>
        </div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="grid grid-cols-3 gap-3 mt-5 pt-4 border-t border-slate-800">
        <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-center">
          <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Target Regions</span>
          <span class="text-xs font-semibold text-cyan-300"><i class="fa-solid fa-earth-asia mr-1"></i>SG / JP</span>
        </div>
        <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-center">
          <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Node Limit</span>
          <span class="text-xs font-semibold text-emerald-400"><i class="fa-solid fa-server mr-1"></i>50+ Nodes</span>
        </div>
        <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-center">
          <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Schedule</span>
          <span class="text-xs font-semibold text-purple-400"><i class="fa-solid fa-clock mr-1"></i>Every 6H</span>
        </div>
      </div>
    </div>

    <!-- Main Controls Panel -->
    <div class="glass-panel rounded-3xl p-6 shadow-2xl space-y-5">
      
      <!-- PAT Token Input Box -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <label class="text-slate-300 font-medium flex items-center gap-1.5">
            <i class="fa-solid fa-key text-cyan-400"></i> GitHub Access Token
          </label>
          <span class="text-[10px] text-slate-400">(Saved securely in browser)</span>
        </div>
        <div class="relative">
          <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-3.5 pr-10 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition duration-150">
          <button type="button" onclick="toggleTokenVisibility()" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300">
            <i id="eyeIcon" class="fa-regular fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="triggerUpdate()" id="updateBtn"
        class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 glow-cyan flex items-center justify-center gap-2 group cursor-pointer active:scale-[0.99]">
        <i id="btnIcon" class="fa-solid fa-arrows-rotate group-hover:rotate-180 transition duration-500"></i>
        <span id="btnText">Trigger GitHub Scraping Engine</span>
      </button>

      <!-- Status Toast Box -->
      <div id="statusBox" class="hidden p-3 rounded-xl text-xs flex items-center gap-2.5 border transition-all duration-200">
        <i id="statusIcon" class="fa-solid fa-circle-info"></i>
        <span id="statusMessage"></span>
      </div>

      <!-- Output Subscription Link Box -->
      <div class="space-y-2 pt-2 border-t border-slate-800/80">
        <label class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-link text-cyan-400"></i> Active Subscription URL
        </label>
        
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 rounded-xl p-1.5">
          <input type="text" id="subUrl" readonly value="https://raw.githubusercontent.com/Thuzinheine/ai-vpn/main/sub.txt"
            class="w-full bg-transparent border-0 px-2.5 text-xs text-cyan-300 font-mono tracking-tight select-all focus:outline-none">
          <button onclick="copySubLink()" id="copyBtn" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition active:scale-95">
            <i id="copyIcon" class="fa-regular fa-copy"></i>
            <span id="copyText">Copy</span>
          </button>
        </div>
        <p class="text-[11px] text-slate-400 text-center">NekoBox, v2rayNG သို့မဟုတ် Sing-box ထဲသို့ ထည့်သွင်း အသုံးပြုနိုင်ပါသည်။</p>
      </div>

    </div>

    <!-- Footer -->
    <div class="text-center text-[11px] text-slate-400 flex items-center justify-center gap-3">
      <span><i class="fa-solid fa-shield-cat text-cyan-400 mr-1"></i> Anti-Censorship Core</span>
      <span>•</span>
      <span>Automated by GitHub Actions</span>
    </div>

  </div>

  <script>
    const OWNER = "Thuzinheine";
    const REPO = "ai-vpn";
    const WORKFLOW_ID = "main.yml";

    // Load stored token
    document.getElementById("tokenInput").value = localStorage.getItem("gh_token") || "";

    function toggleTokenVisibility() {
      const input = document.getElementById("tokenInput");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    function showStatus(message, type = "info") {
      const box = document.getElementById("statusBox");
      const msg = document.getElementById("statusMessage");
      const icon = document.getElementById("statusIcon");

      box.className = "p-3 rounded-xl text-xs flex items-center gap-2.5 border transition-all duration-200 ";
      
      if (type === "success") {
        box.classList.add("bg-emerald-500/10", "border-emerald-500/20", "text-emerald-300");
        icon.className = "fa-solid fa-circle-check text-emerald-400";
      } else if (type === "error") {
        box.classList.add("bg-rose-500/10", "border-rose-500/20", "text-rose-300");
        icon.className = "fa-solid fa-circle-xmark text-rose-400";
      } else {
        box.classList.add("bg-cyan-500/10", "border-cyan-500/20", "text-cyan-300");
        icon.className = "fa-solid fa-arrows-rotate fa-spin text-cyan-400";
      }

      msg.innerText = message;
      box.classList.remove("hidden");
    }

    async function triggerUpdate() {
      const token = document.getElementById("tokenInput").value.trim();
      const btn = document.getElementById("updateBtn");
      const btnText = document.getElementById("btnText");
      const btnIcon = document.getElementById("btnIcon");

      if (!token) {
        showStatus("GitHub Personal Access Token (PAT) အရင် ထည့်ပေးပါ!", "error");
        return;
      }

      localStorage.setItem("gh_token", token);
      btn.disabled = true;
      btn.classList.add("opacity-60", "cursor-not-allowed");
      btnIcon.classList.add("fa-spin");
      btnText.innerText = "Dispatching Workflow...";
      showStatus("GitHub Actions ပေါ်သို့ စတင် Run ခိုင်းနေပါသည်...", "loading");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (response.status === 204) {
          showStatus("Scraping စတင် run နေပါပြီ! ၁ မိနစ်အတွင်း Node များ refresh ဖြစ်ပါမည်။", "success");
          
          // Cache-busting URL with timestamp
          const freshSubUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/sub.txt?t=${Date.now()}`;
          document.getElementById("subUrl").value = freshSubUrl;
        } else {
          const errData = await response.json();
          showStatus(`Error: ${errData.message || "Failed to trigger workflow"}`, "error");
        }
      } catch (err) {
        showStatus("Network connection error ဖြစ်ပေါ်နေပါသည်။", "error");
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-60", "cursor-not-allowed");
        btnIcon.classList.remove("fa-spin");
        btnText.innerText = "Trigger GitHub Scraping Engine";
      }
    }

    function copySubLink() {
      const input = document.getElementById("subUrl");
      input.select();
      navigator.clipboard.writeText(input.value);

      const copyText = document.getElementById("copyText");
      const copyIcon = document.getElementById("copyIcon");

      copyText.innerText = "Copied!";
      copyIcon.className = "fa-solid fa-check text-emerald-400";

      setTimeout(() => {
        copyText.innerText = "Copy";
        copyIcon.className = "fa-regular fa-copy";
      }, 2000);
    }
  </script>
</body>
</html>
